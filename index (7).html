<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="학교 교육과정 편제표를 기준으로 학생이 스스로 학점 이수 현황, 필수 이수학점, 과목 순서, 다음 학기 과목을 확인하는 도구">
<title>과목 이수현황 관리 도구</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='8' height='10' rx='2' fill='%23C8675D'/%3E%3Crect x='12' y='4' width='8' height='10' rx='2' fill='%234F72AE'/%3E%3Crect x='22' y='4' width='8' height='10' rx='2' fill='%233F8B6E'/%3E%3Crect x='2' y='18' width='8' height='10' rx='2' fill='%23F3E9D4' stroke='%23C39234' stroke-width='1.5'/%3E%3Crect x='12' y='18' width='8' height='10' rx='2' fill='none' stroke='%239AA3B5' stroke-width='1.5' stroke-dasharray='2 2'/%3E%3Crect x='22' y='18' width='8' height='10' rx='2' fill='none' stroke='%239AA3B5' stroke-width='1.5' stroke-dasharray='2 2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B45; --ink2:#4A5670; --ink3:#77819A; --line:#D8DFEB; --line2:#E9EDF4; --paper:#F5F7FB; --panel:#FFFFFF;
  --focus:#6F93E0; --red:#B4463C; --red-soft:#F8E9E7; --amber:#B7791F; --amber-soft:#FAF0DC; --green:#2F7D5B; --green-soft:#E2F0E8;
  --hl:#FFE27A; --hl-edge:#E9C84F;
  --cell:13px; --gap:2px;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
.a-kor{--c:#C8675D;--cs:#F4E0DE;--cp:#DDA39D}
.a-math{--c:#4F72AE;--cs:#DDE5F2;--cp:#98ADD1}
.a-eng{--c:#7D64A8;--cs:#E7E1F0;--cp:#B3A5CC}
.a-soc{--c:#C39234;--cs:#F3E9D4;--cp:#DBBF86}
.a-sci{--c:#3F8B6E;--cs:#D9EBE3;--cp:#8DBBA9}
.a-pe{--c:#D07F3E;--cs:#F6E5D6;--cp:#E4B38B}
.a-art{--c:#B25E8C;--cs:#F1DEE8;--cp:#D09CB9}
.a-life{--c:#7A8A5C;--cs:#E5E9DC;--cp:#AFB999}
.a-etc{--c:#8A8F99;--cs:#E7E8EB;--cp:#B9BCC2}
.a-cha{--c:#98A2B6;--cs:#E9ECF1;--cp:#C3C9D4}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.65 var(--font);font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:8px 12px;z-index:30}
.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hl{background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 94%,transparent 94%);padding:0 .12em;border-radius:1px}
.small{font-size:13px;color:var(--ink2)}
.grow{flex:1}
.linklike{appearance:none;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.linklike:hover{color:#000}

/* 머리 */
.top{background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:20px 22px 16px;display:flex;gap:24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center}
.logo{display:grid;grid-template-columns:repeat(3,9px);gap:2px;flex:none}
.logo i{width:9px;height:9px;border-radius:2px;background:var(--c);border:1.5px solid var(--c)}
.logo i.p{background:var(--cs)}
.logo i.e{background:transparent;border:1.5px dashed #AEB7C8}
.brand h1{font-size:25px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.015em}
.brand p{margin:3px 0 0;color:var(--ink2);font-size:14px}
.maker{text-align:right;font-size:12px;line-height:1.55;color:var(--ink2);flex:none}
.maker b{display:block;color:var(--ink);font-weight:600;font-size:13px}

/* 탭 */
.tabs{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1100px;margin:0 auto;display:flex;gap:2px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;font-weight:500;color:var(--ink2);padding:12px 12px 9px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-size:15px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab .pip{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hl-edge);margin-left:5px;vertical-align:2px}
.tab-teacher{margin-left:auto;color:var(--ink3);font-size:14px}

main{max-width:1100px;margin:0 auto;padding:26px 22px 70px;outline:none;display:block}
h2{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16.5px;line-height:1.35;margin:0 0 10px;font-weight:600}
h4{font-size:15px;margin:0 0 6px;font-weight:600}
.lede{color:var(--ink2);margin:0 0 18px;max-width:66ch}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 16px}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start}
.grid2>.panel{margin:0 0 16px}
.note{background:#EEF2F8;border-left:3px solid var(--ink3);padding:9px 14px;border-radius:4px;margin:0 0 16px;font-size:14px;color:var(--ink2)}
.banner{background:var(--amber-soft);border:1px solid #EBD3A3;padding:10px 14px;border-radius:8px;margin:0 0 18px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.ok{color:var(--green);margin:4px 0}
.bad{color:var(--red)}

/* 버튼 */
.btn{appearance:none;font-weight:500;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;line-height:1.4;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#AEB9CE;background:#FAFBFD}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:#2B3B5E;border-color:#2B3B5E}
.btn-danger{color:var(--red);border-color:#E7C7C2}
.btn-danger:hover{background:var(--red-soft);border-color:#DDB0A9}
.btn-small{font-size:13px;padding:3px 10px;border-radius:6px}
.btn-quiet{border-color:transparent;color:var(--ink3);background:transparent}
.btn-quiet:hover{color:var(--red);background:var(--red-soft);border-color:transparent}
.actions{display:flex;gap:8px;align-items:center;margin-top:14px}
.actions.wrap{flex-wrap:wrap}
label.btn input[type=file]{display:none}

/* 학점 칸 */
.seg{display:inline-flex;gap:var(--gap);flex:none}
.cell{display:inline-block;width:var(--cell);height:var(--cell);border-radius:2px;background:var(--c);border:1.5px solid var(--c);flex:none}
.cell.s-ongoing{background:repeating-linear-gradient(135deg,var(--c) 0 2px,#fff 2px 4px)}
.cell.s-planned{background:var(--cs)}
.cell.s-recovered{box-shadow:inset 0 0 0 2px #fff}
.cell.s-fail{background:#fff linear-gradient(135deg,transparent 42%,var(--red) 42% 58%,transparent 58%);border-color:var(--red)}
.cell.s-empty{background:transparent;border:1.5px dashed #A9B2C4}

.hero{padding:22px 24px 18px}
.readout{font-size:18.5px;line-height:1.6;margin:0 0 18px;max-width:60ch;letter-spacing:-.005em}
.readout b{font-weight:700}
.ribbon{display:grid;gap:7px;margin:0 0 14px}
.rb-row{display:grid;grid-template-columns:92px 1fr 40px;align-items:center;gap:12px}
.rb-term{font-size:13px;color:var(--ink2);white-space:nowrap}
.rb-term .short{display:none}
.rb-row.is-now .rb-term{color:var(--ink);font-weight:600}
.rb-row.is-now .rb-term::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-left:6px;vertical-align:2px}
.rb-cells{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;min-height:var(--cell)}
.rb-sum{text-align:right;font-size:13px;color:var(--ink2)}
.ribbon.intro .rb-row{animation:rbIn .5s ease-out both}
.ribbon.intro .rb-row:nth-child(2){animation-delay:.06s}
.ribbon.intro .rb-row:nth-child(3){animation-delay:.12s}
.ribbon.intro .rb-row:nth-child(4){animation-delay:.18s}
.ribbon.intro .rb-row:nth-child(5){animation-delay:.24s}
.ribbon.intro .rb-row:nth-child(6){animation-delay:.3s}
@keyframes rbIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line2);padding-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .gap{flex-basis:100%;height:0}

/* 확인할 일 */
.alerts{list-style:none;margin:0;padding:0}
.alert{display:grid;grid-template-columns:12px 1fr auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:start}
.alert:last-child{border-bottom:0}
.alert .dot{width:9px;height:9px;border-radius:50%;margin-top:8px;background:#C4CBD8}
.alert.act .dot{background:var(--ink)}
.alert.warn .dot{background:var(--amber)}
.al-title{font-weight:600;line-height:1.5}
.alert.info .al-title{font-weight:500}
.al-detail{color:var(--ink2);font-size:13.5px;margin-top:2px}
.more summary{cursor:pointer;color:var(--ink2);font-size:14px;padding:8px 0}

/* 교과군 막대 */
.area-row{display:grid;grid-template-columns:70px 1fr 104px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.area-row:last-child{border-bottom:0}
.area-name{font-weight:500;font-size:14px}
.bar{position:relative;height:12px;background:#EDF0F5;border-radius:3px;display:flex}
.bar i{display:block;height:100%}
.bar i:first-child{border-radius:3px 0 0 3px}
.b-earned{background:var(--c)}
.b-ongoing{background:repeating-linear-gradient(135deg,var(--c) 0 3px,var(--cs) 3px 6px)}
.b-planned{background:var(--cs);box-shadow:inset 0 0 0 1px var(--c)}
.b-forced{box-shadow:inset 0 0 0 1px var(--c);background:repeating-linear-gradient(90deg,transparent 0 4px,#fff 4px 6px)}
.bar .req{position:absolute;top:-5px;bottom:-5px;width:2.5px;margin-left:-1px;background:var(--ink);border-radius:1px}
.area-num{text-align:right;font-size:14px;color:var(--ink2);line-height:1.3}
.area-num b{color:var(--ink);font-size:16px}
.area-num small{display:block;font-size:12px}
.area-num small.lack{color:var(--ink);font-weight:600}

/* 공통과목·기준 */
.common{list-style:none;margin:0;padding:0}
.common li{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2);align-items:center;font-size:14px}
.common li:last-child{border-bottom:0}
.cm-label{font-weight:500}
.cm-part{display:flex;justify-content:space-between;gap:6px;padding:3px 9px;border-radius:6px;background:#F1F3F7;font-size:13px}
.cm-part small{color:var(--ink3)}
.cm-part.st-done,.cm-part.st-recovered{background:var(--green-soft)}
.cm-part.st-done small,.cm-part.st-recovered small{color:var(--green)}
.cm-part.st-fail{background:var(--red-soft)}
.cm-part.st-fail small{color:var(--red);font-weight:600}
.cm-part.st-missing{background:#fff;border:1px dashed var(--line)}
table.plain{border-collapse:collapse;width:100%;font-size:14px}
table.plain th,table.plain td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:top}
table.plain th:first-child,table.plain td:first-child{text-align:left}
table.plain thead th{font-size:12.5px;color:var(--ink3);font-weight:500;border-bottom:1px solid var(--line)}
td.flag-bad{color:var(--red);font-weight:600}
td.flag-ok{color:var(--green)}

.pre-list{list-style:none;margin:0;padding:0}
.pre-list li{padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px}
.pre-list li:last-child{border-bottom:0}
.pre-list .lv{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:4px;margin-right:6px;border:1px solid var(--line);color:var(--ink2)}
.pre-list .lv.strict{border-color:var(--ink);color:var(--ink)}

/* 내 정보 */
.home{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.field{display:flex;flex-direction:column;gap:5px;border:0;padding:0;margin:0 0 16px;min-width:0}
.field>span,.field>legend{font-size:13px;font-weight:600;color:var(--ink2);padding:0;margin-bottom:5px}
.field small{color:var(--ink3);font-size:12.5px}
.field input[type=text],.field input[type=url],.field input[type=number],.field select,.inp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:15px;min-width:0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cur-list{display:grid;gap:8px}
.cur-opt{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
.cur-opt input{grid-row:1 / span 2;margin-top:5px;accent-color:var(--ink)}
.cur-opt.is-on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.cur-year{font-weight:600}
.cur-title{font-size:13.5px;color:var(--ink2)}
.tag-sample{font-style:normal;font-size:11.5px;border:1px solid var(--line);padding:0 6px;border-radius:4px;margin-left:4px;color:var(--ink3)}
.steps{margin:0 0 18px;padding-left:20px}
.steps li{margin:0 0 8px}
.side h3{margin-top:4px}

/* 학기별 입력 */
.jumpbar{position:sticky;top:47px;z-index:9;display:flex;gap:6px;flex-wrap:wrap;background:rgba(245,247,251,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:8px 0 10px;margin:0 0 8px}
.jump{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
.jump-now{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.jump-past{color:var(--ink2)}
.jump .pip{width:7px;height:7px;border-radius:50%;background:var(--hl-edge)}
.jump.has-fail{border-color:#E1B2AB}
.term{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;scroll-margin-top:110px}
.term-now{border-color:#9AA6BD}
.term-head{display:flex;align-items:baseline;gap:10px;padding:14px 22px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.term-head h3{margin:0;font-size:18px}
.when{font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);font-weight:500}
.when-now{background:var(--ink);color:#fff;border-color:var(--ink)}
.when-next{background:var(--hl);border-color:var(--hl-edge);color:var(--ink)}
.term-sum{margin-left:auto;font-size:13px;color:var(--ink2)}
.term-body{padding:6px 22px 16px}
.sub{margin:16px 0 6px;font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sub .hint{font-weight:400;color:var(--ink3);font-size:12.5px}
.sub .pick{font-weight:600;color:var(--ink);background:#EEF1F6;border-radius:4px;padding:0 6px}
.sub .count{font-weight:600;color:var(--ink)}
.courses{list-style:none;margin:0;padding:0}
.course>.seg,.cha-line>.seg,.fixed-list li>.seg{flex-wrap:wrap;row-gap:var(--gap);max-width:80px}
.fixed-list li>.seg{width:80px}
.course{display:grid;grid-template-columns:80px 1fr auto auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--line)}
.course:last-child{border-bottom:0}
.cbody{display:flex;flex-direction:column;min-width:0}
.cname{font-weight:500;line-height:1.4}
.cmeta{font-size:12.5px;color:var(--ink3);display:flex;flex-wrap:wrap;align-items:center}
.ctag{font-size:12px;color:var(--ink3);margin-top:1px}
.ctag::before{content:"";display:inline-block;width:6px;height:6px;border-radius:1px;border:1px solid #AEB7C8;margin-right:5px;vertical-align:1px}
.cmeta span+span::before,.term-sum span+span::before,.meta span+span::before,.fine span+span::before{content:"";display:inline-block;width:1px;height:.8em;background:#C5CCD9;margin:0 .55em;vertical-align:-.05em}
select.st{font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:88px}
select.st.v-fail{border-color:var(--red);color:var(--red);background:var(--red-soft);font-weight:600}
select.st.v-recovered{border-color:#A9CDB9;background:var(--green-soft)}
.st-fixed{font-size:13px;color:var(--ink3);min-width:88px;text-align:right}
.box{margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.opt{appearance:none;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px;line-height:1.35;text-align:left}
.opt:hover{border-color:#9AA6BD}
.opt .dot{width:8px;height:8px;border-radius:2px;background:var(--c,#AAB)}
.opt .opt-cr{font-size:12px;color:var(--ink3)}
.opt .opt-note{font-size:11.5px;color:var(--ink3)}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt[aria-pressed="true"] .opt-cr,.opt[aria-pressed="true"] .opt-note{color:#D3D9E6}
.opt[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px #fff}
.opt:disabled{cursor:default;opacity:.8}
.need{margin:2px 0 6px;font-size:13.5px}
.cha-line{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:10px 0 0;margin-top:12px;border-top:1px solid var(--line2)}
.ex-form{display:grid;grid-template-columns:2fr 1fr 1fr 80px 1.2fr 1fr;gap:8px;align-items:end;background:#F7F9FC;border:1px solid var(--line2);border-radius:10px;padding:12px;margin:8px 0}
.ex-form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink2);min-width:0}
.ex-form input,.ex-form select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;font-size:14px;min-width:0}
.ex-form .actions{grid-column:1 / -1;margin-top:4px}
.extras{margin-top:10px}

/* 다음 학기 안내 */
.guide-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.guide-head select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;font-size:15px;font-weight:600}
.pick-group{margin:4px 0 22px}
.pick-group:last-child{margin-bottom:4px}
.pick-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.pick-head h4{margin:0;font-size:16px}
.opt-list{list-style:none;margin:0;padding:0}
.opt-row{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.opt-row:last-child{border-bottom:0}
.tick{appearance:none;width:26px;height:26px;border-radius:7px;border:1.5px solid #AEB7C8;background:#fff;cursor:pointer;display:grid;place-items:center;margin-top:1px;padding:0}
.tick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.tick[aria-pressed="true"]::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.opt-main .nm{font-weight:600}
.opt-row.is-blocked .nm{color:var(--ink2)}
.meta{font-size:12.5px;color:var(--ink3);display:inline-flex;flex-wrap:wrap;align-items:center;margin-left:8px}
.tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.tagx{font-size:12.5px;padding:1px 8px;border-radius:5px;line-height:1.55}
.tagx.good{background:var(--green-soft);color:#205640}
.tagx.warn{background:var(--amber-soft);color:#744A0B}
.tagx.bad{background:var(--red-soft);color:#8A2E25}
.fine{font-size:12.5px;color:var(--ink3);margin-top:3px}
.fixed-list{columns:2 240px;column-gap:28px;list-style:none;margin:0;padding:0}
.fixed-list li{break-inside:avoid;padding:5px 0;display:flex;gap:10px;align-items:center;font-size:14.5px}
.fixed-list .warnline{display:block;color:#744A0B;font-size:12.5px}

/* 진로·학업 설계 지원 도구 연결 */
.career-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:16px 20px;margin:0 0 18px;background:#EEF2F9;border:1px solid #C3CEE3;border-radius:14px;color:var(--ink);text-decoration:none}

.cc-title{display:block;font-size:18px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.cc-desc{display:block;font-size:14px;line-height:1.55;color:var(--ink2);margin-top:3px;max-width:64ch}
.cc-go{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-size:14.5px;font-weight:600;white-space:nowrap}
.career-card.is-compact{grid-template-columns:auto 1fr;gap:12px 14px;padding:14px 16px;margin:0 0 22px}

.career-card.is-compact .cc-title{font-size:16px}

.career-card.is-compact .cc-go{grid-column:1 / -1;padding:8px 16px}

.src{font-size:12.5px;color:var(--ink3);margin-top:28px;border-top:1px solid var(--line2);padding-top:10px}

/* 교사용 */

.tstep::before{content:counter(ts);width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;margin-top:18px}
.tstep>.panel{margin:0;min-width:0}
.drop{border:1.5px dashed #AEB7C8;border-radius:12px;padding:18px;text-align:center;background:#FAFBFD;color:var(--ink2)}

.ed-check td,.ed-check th{padding:2px 10px 2px 0;text-align:right}

.req-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.req-grid input{width:58px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;text-align:right}

  res.notes.push(`${J(`'${r.name}'`, '을/를')} ${parts.length}과목으로 나눴습니다${plan.notes.length ? ` (${plan.notes.join(', ')})` : ''}.`);
  return res;
}
function detectYear(texts) {
  const list = texts.map(x => String(x || '').normalize('NFKC'));
  for (const s of list) { const m = s.match(/(20\d{2})\s*학년도?[\s_]*(?:입학|신입)/); if (m) return +m[1]; }
  for (const s of list) { const m = s.match(/(20\d{2})\s*학년도/); if (m) return +m[1]; }
  for (const s of list) { const m = s.match(/(?<!\d)(20[2-4]\d)(?!\d)/); if (m) return +m[1]; }
  return null;
}

function scanSheet(sh, fileName) {
  const { grid, origin, span } = sh;
  const nR = grid.length, nC = nR ? grid[0].length : 0;
  const diag = { sheet: sh.name, notes: [] };
  if (!nR || !nC) return { ok: false, diag, reason: '빈 시트입니다.' };

  // 1) 과목명 열: 과목 목록과 가장 많이 맞는 열
  let subjCol = -1, best = 0;
  for (let c = 0; c < nC; c++) {
    const seen = new Set();
    for (let r = 0; r < nR; r++) {
      const v = grid[r][c];
      const sj = lookupSubject(v);
      if (sj) seen.add(sj.name);
      else if (v && LIST_SEP.test(v)) { const ps = splitSubjects(v); if (ps) for (const p of ps) if (p.subj) seen.add(p.subj.name); }
    }
    if (seen.size > best) { best = seen.size; subjCol = c; }
  }
  diag.subjCol = subjCol; diag.subjMatches = best;
  if (best < 3) return { ok: false, diag, reason: `2022 개정 과목명을 ${best}개만 찾았습니다(3개 이상 필요).` };
  let firstSubj = nR;
  const listHasSubject = v => { const ps = v && LIST_SEP.test(v) ? splitSubjects(v) : null; return !!(ps && ps.some(p => p.subj)); };
  for (let r = 0; r < nR; r++) if (lookupSubject(grid[r][subjCol]) || listHasSubject(grid[r][subjCol])) { firstSubj = r; break; }

  // 2) 머리글(첫 과목 위쪽) — 표 전체를 덮는 제목 병합은 제외
  const hdr = [];
  for (let c = 0; c < nC; c++) {
    const parts = [];
    for (let r = 0; r < firstSubj; r++) {
      const v = grid[r][c];
      if (!v) continue;
      const sp = span[r][c];
      if (sp && sp.w >= Math.max(5, nC * 0.6)) continue;
      if (String(v).length > 30) continue;
      if (parts[parts.length - 1] !== v) parts.push(v);
    }
    hdr.push(parts);
  }
  const lastHdr = c => clean((hdr[c] || [])[hdr[c].length - 1] || '');
  const allHdr = c => clean((hdr[c] || []).join(' '));

  // 3) 학기 열(가로형) 찾기 — 병합이 풀린 머리글(CSV 등)은 왼쪽 학년을 이어받음
  const termCands = {};
  const gOf = [], sOf = [], skipCol = [];
  for (let c = 0; c < nC; c++) {
    const H = hdr[c].map(x => String(x).normalize('NFKC'));
    const joined = H.join(' | ');
    skipCol[c] = c === subjCol || (/소\s*계|합\s*계|총\s*계|누계|필수|기준|비고|시수|시간/.test(joined) && !/학기/.test(joined)) || /소\s*계|합\s*계/.test(joined);
    let g = null, s = null;
    for (const h of H) {
      let m = h.match(/(?<!\d)([1-3])\s*학년\s*([12])\s*학기/);
      if (m) { g = m[1]; s = m[2]; continue; }
      m = h.match(/^\s*([1-3])\s*[-–~·\/]\s*([12])\s*$/);
      if (m) { g = m[1]; s = m[2]; continue; }
      m = h.match(/(?<!\d)([1-3])\s*학년(?!도)/); if (m) g = m[1];
      m = h.match(/(?<!\d)([12])\s*학기/); if (m) s = m[1];
      if (/^\s*[12]\s*$/.test(h) && g) s = h.trim();
    }
    gOf[c] = g; sOf[c] = s;
  }
  for (let c = 1; c < nC; c++) {
    if (skipCol[c] || gOf[c] || !sOf[c]) continue;
    for (let k = c - 1; k >= Math.max(0, c - 2); k--) {
      if (gOf[k] && sOf[k] && sOf[k] !== sOf[c] && !hdr[c].some(x => /학년/.test(x))) { gOf[c] = gOf[k]; break; }
    }
  }
  for (let c = 0; c < nC; c++) {
    if (skipCol[c] || !gOf[c] || !sOf[c]) continue;
    (termCands[`${gOf[c]}-${sOf[c]}`] = termCands[`${gOf[c]}-${sOf[c]}`] || []).push(c);
  }
  const termCols = {};
  for (const t of TERMS) {
    const cs = termCands[t];
    if (!cs) continue;
    let bc = cs[0], bn = -1e9;
    for (const c of cs) {
      let n = 0;
      for (let r = firstSubj; r < nR; r++) { const p = parseTermCell(grid[r][c]); if (p && (p.credit || p.pick)) n++; }
      const h = allHdr(c);
      if (/학점|운영|편성/.test(h)) n += 0.5;
      if (/시수|시간/.test(h)) n -= 50;
      if (n > bn) { bn = n; bc = c; }
    }
    termCols[t] = bc;
  }
  let mode = Object.keys(termCols).length >= 2 ? 'H' : null;

  // 4) 세로형(학년·학기 값이 칸에 들어 있는 형식)
  let gradeCol = -1, semCol = -1, termValCol = -1, creditCol = -1;
  const baseCol = (() => { for (let c = 0; c < nC; c++) if (/기준\s*학점/.test(allHdr(c))) return c; return -1; })();
  if (!mode) {
    for (let c = 0; c < nC; c++) {
      if (c === subjCol) continue;
      const h = lastHdr(c).replace(/\s+/g, '');
      if (/^학년$/.test(h)) gradeCol = c;
      else if (/^학기$/.test(h)) semCol = c;
      else if (/^(학년[-·\/]?학기|이수시기|개설시기|개설학기|이수학기)$/.test(h)) termValCol = c;
      else if (/학점$/.test(h) && !/기준|필수|합계|소계/.test(h) && creditCol < 0) creditCol = c;
    }
    if (creditCol < 0) creditCol = baseCol;
    if (creditCol >= 0 && ((gradeCol >= 0 && semCol >= 0) || termValCol >= 0)) mode = 'V';
  }
  diag.mode = mode;
  diag.termCols = termCols;
  if (!mode) return { ok: false, diag, reason: '학년·학기 열을 찾지 못했습니다. 머리글에 "1학년 1학기" 또는 "1-1"처럼 적혀 있는지 확인해 주세요.' };

  // 5) 나머지 열 — 내용으로 판정
  const used = new Set([subjCol, gradeCol, semCol, termValCol, creditCol, baseCol, ...Object.values(termCols)].filter(x => x >= 0));
  const countRows = (c, pred) => { let n = 0; for (let r = firstSubj; r < nR; r++) if (pred(clean(grid[r][c]))) n++; return n; };
  const bestCol = (pred, min, exclude) => {
    let bc = -1, bn = min - 1;
    for (let c = 0; c < nC; c++) { if (used.has(c) || (exclude && exclude.has(c))) continue; const n = countRows(c, pred); if (n > bn) { bn = n; bc = c; } }
    return bc;
  };
  const typeCol = bestCol(v => /^(공통|일반|진로|융합)(\s*(과목|선택))?(\s*과목)?$/.test(v), 3);
  if (typeCol >= 0) used.add(typeCol);
  const groupCol = bestCol(v => !!areaFromText(v) && norm(v).length <= 22 && !lookupSubject(v), 3);
  if (groupCol >= 0) used.add(groupCol);
  const hdrCol = re => { for (let c = 0; c < nC; c++) if (!used.has(c) && re.test(allHdr(c))) return c; return -1; };
  let pickCol = -1;
  for (let c = 0; c < nC; c++) if (!used.has(c) && /^(택|택\s*수|선택\s*(과목)?\s*수|이수\s*과목\s*수)$/.test(lastHdr(c))) { pickCol = c; break; }
  if (pickCol >= 0) used.add(pickCol);
  let selCol = hdrCol(/선택\s*(군|그룹|블록|영역|과목군)|과목\s*군|그룹|^군$/);
  if (selCol < 0) selCol = bestCol(v => /^(선택|택)\s*\S{0,6}$|^[A-Z가-하]\s*군$|^선택\s*[A-Z0-9가-하]/.test(v), 2);
  if (selCol >= 0) used.add(selCol);
  const crossCol = hdrCol(/교차/);
  if (crossCol >= 0) used.add(crossCol);
  const noteCol = hdrCol(/비고/);
  let opCol = -1;
  for (let c = 0; c < nC; c++) if (!used.has(c) && /운영\s*학점|편성\s*학점/.test(allHdr(c))) { opCol = c; break; }
  if (opCol >= 0) used.add(opCol);
  const evalCol = hdrCol(/성적\s*처리|평가\s*(방법|방식|유형)|성적\s*(산출|유형)/);
  if (evalCol >= 0) used.add(evalCol);
  const zoneCols = [];
  for (let c = 0; c < nC; c++) if (!used.has(c) && c !== noteCol && (c < subjCol || /^구분$|과정/.test(lastHdr(c)))) zoneCols.push(c);
  Object.assign(diag, { typeCol, groupCol, selCol, pickCol, crossCol, baseCol, opCol, evalCol, gradeCol, semCol, termValCol, creditCol, zoneCols });

  const zoneOf = r => {
    for (const c of zoneCols) {
      const v = clean(grid[r][c]).replace(/\s+/g, '');
      if (!v) continue;
      if (/소인수|공동교육|공동과정/.test(v)) return 'offer';
      if (/학교지정|지정과목|^지정|^공통과목|필수과목/.test(v)) return '지정';
      if (/학생선택|선택과목|^선택/.test(v)) return '선택';
      if (/^창체|창의적체험/.test(v)) return '창체';
    }
    return null;
  };
  const smallPickLeft = r => {
    for (const c of zoneCols) {
      const sp = span[r][c];
      if (sp && sp.h > 16) continue;
      const p = parsePick(grid[r][c]);
      if (p) return { pick: p, key: sp ? 'L|' + sp.id : null, label: clean(grid[r][c]) };
    }
    return null;
  };
  const termOfV = r => {
    if (termValCol >= 0) {
      const v = String(grid[r][termValCol]).normalize('NFKC');
      let m = v.match(/([1-3])\s*학년\s*([12])\s*학기/) || v.match(/([1-3])\s*[-–·\/]\s*([12])/);
      return m ? `${m[1]}-${m[2]}` : null;
    }
    const g = String(grid[r][gradeCol]).normalize('NFKC').match(/[1-3]/);
    const s = String(grid[r][semCol]).normalize('NFKC').match(/[12]/);
    return g && s ? `${g[0]}-${s[0]}` : null;
  };

  // 5-2) 사전 점검 — 편제 밖 줄(소인수·공동교육과정), 택N 표시와 묶음 경계
  const OFF_RE = /공동\s*교육\s*과정|소인수|온라인\s*학교|학교\s*밖\s*교육/;
  const offRow = {};
  const pickHead = {};
  if (mode === 'H') {
    const isSubjRow = r => {
      const v = clean(grid[r][subjCol]);
      return !!v && !isTotalLabel(v) && !CHA_RE.test(v) && (!!lookupSubject(v) || !!splitSubjects(v) || isSubjectLike(v));
    };
    for (let r = firstSubj; r < nR; r++) {
      if (zoneOf(r) === 'offer') { offRow[r] = true; continue; }
      for (const t in termCols) if (OFF_RE.test(grid[r][termCols[t]])) { offRow[r] = true; break; }
    }
    const markers = [];
    const seenMark = new Set();
    for (let r = firstSubj; r < nR; r++) {
      if (offRow[r]) continue;
      for (const t in termCols) {
        const c = termCols[t];
        const pk = parsePick(grid[r][c]);
        if (!pk) continue;
        const sp = span[r][c];
        const id = sp ? sp.id : `${r}:${c}`;
        if (seenMark.has(id)) continue;
        seenMark.add(id);
        markers.push({ r: sp ? sp.r : r, t, c, pick: pk, h: sp ? sp.h : 1 });
      }
    }
    // (1) 세로 병합 칸 하나에 택N 표시가 하나씩 든 열(예: 이수 학점)을 묶음 경계로 쓴다
    if (markers.length >= 2) {
      const firstMark = Math.min(...markers.map(m => m.r));
      const subjRows = [];
      for (let r = firstMark; r < nR; r++) if (!offRow[r] && isSubjRow(r)) subjRows.push(r);
      const termColSet = new Set(Object.values(termCols));
      let best = null;
      for (let c = 0; c < nC; c++) {
        if (c === subjCol || termColSet.has(c)) continue;
        const spans = new Map();
        for (let r = firstSubj; r < nR; r++) { const sp = span[r][c]; if (sp && sp.h >= 2 && sp.w === 1 && !spans.has(sp.id)) spans.set(sp.id, sp); }
        if (spans.size < 2) continue;
        const good = [];
        let bad = 0;
        for (const sp of spans.values()) {
          const inside = markers.filter(m => m.r >= sp.r && m.r < sp.r + sp.h);
          if (inside.length === 1) good.push({ sp, m: inside[0] }); else if (inside.length > 1) bad++;
        }
        if (bad || good.length < 2 || !subjRows.length) continue;
        const cover = subjRows.filter(r => good.some(g => r >= g.sp.r && r < g.sp.r + g.sp.h)).length / subjRows.length;
        if (cover >= 0.9 && (!best || cover > best.cover)) best = { c, cover, good };
      }
      if (best) {
        diag.blockCol = best.c;
        for (const g of best.good) for (let r = g.sp.r; r < g.sp.r + g.sp.h; r++) if (!offRow[r]) pickHead[r] = { key: 'N|' + g.sp.id, pick: g.m.pick, t: g.m.t };
      }
    }
    // (2) 첫 선택지 줄의 택N + 바로 아래 세로 병합 학점 칸
    if (diag.blockCol == null) {
      for (const m of markers) {
        if (m.h > 1 || m.r + 1 >= nR || !isSubjRow(m.r)) continue;
        const below = span[m.r + 1][m.c];
        if (!below || below.r !== m.r + 1 || below.h < 2 || parsePick(grid[m.r + 1][m.c])) continue;
        for (let r = m.r; r < below.r + below.h; r++) if (!offRow[r] && !pickHead[r]) pickHead[r] = { key: 'P|' + m.r + ':' + m.c, pick: m.pick, t: m.t };
      }
    }
  }
  const offers = [];

  // 6) 행 분류
  const startRow = Math.min(firstSubj, nR);
  const raw = [];
  const totals = { fixed: {}, elective: {}, sum: {}, grand: {} };
  const chaMain = {}, chaSub = {};
  let chaSeen = false, inCha = false, pendingMarker = null;
  const vRows = new Map(); // 세로형: 과목+그룹 → 한 행으로 합치기
  const vLists = new Map(); // 세로형: 같은 쉼표 목록은 모아서 한 번에 나눔
  const listSplit = { cells: 0, subjects: 0 };

  function emitList(info) {
    const plan = planCommaRow(info);
    listSplit.cells++;
    listSplit.subjects += info.parts.length;
    for (const n of plan.notes) diag.notes.push(`${J(`'${info.rawName}'`, '은/는')} ${n}. 확인해 주세요.`);
    const one = p => ({ r: info.r, key: null, label: '', pick: null, termPicks: {}, area: p.subj ? p.subj.area : info.area, type: p.subj ? p.subj.type : info.type, name: p.name, cr: {}, cross: '', crossFlag: false, note: joinNote((p.tags || []).join(' · '), info.note), grading: info.grading || '' });
    info.parts.forEach((p, i) => {
      const rec = one(p);
      if (plan.mode === 'block') Object.assign(rec, { key: info.key, label: info.label, pick: info.pick, termPicks: Object.assign({}, info.picks, plan.picks), cr: Object.assign({}, plan.per) });
      else if (plan.mode === 'cross') Object.assign(rec, { cr: Object.assign({}, plan.per), crossFlag: true, cross: info.crossLabel, crossGroup: 'X|' + info.listId });
      else if (plan.mode === 'seq') rec.cr = { [plan.terms[i]]: plan.per[plan.terms[i]] };
      else rec.cr = Object.assign({}, plan.per);
      if (Object.keys(rec.cr).length) raw.push(rec);
    });
  }
  for (let r = startRow; r < nR; r++) {
    const cells = grid[r];
    const rowText = cells.map(clean).filter(Boolean).join(' ');
    if (!rowText) continue;
    const rawName = clean(cells[subjCol]);
    const subj = lookupSubject(rawName);
    const leftTexts = zoneCols.map(c => clean(cells[c]));
    const zone = zoneOf(r);
    const rowAreaV = areaFromText(groupCol >= 0 ? cells[groupCol] : '') || areaFromText(leftTexts.find(x => areaFromText(x)) || '') || 'etc';
    const rowTypeV = typeFromText(typeCol >= 0 ? cells[typeCol] : '') || '기타';
    const rowGrading = evalCol >= 0 ? gradingFromText(cells[evalCol]) : '';
    const rowNote = noteCol >= 0 ? clean(cells[noteCol]) : '';
    const opv = opCol >= 0 ? numIn(cells[opCol]) : null;
    const nameMarks = stripMarks(rawName);

    const termVals = hours => {
      const o = {};
      const conv = x => (hours && x > 12) ? Math.round(x / 16 * 2) / 2 : x;
      if (mode === 'H') {
        for (const t in termCols) { const m = String(cells[termCols[t]]).normalize('NFKC').match(/\d+(?:\.\d+)?/); if (m) { const x = conv(parseFloat(m[0])); if (x > 0) o[t] = x; } }
      } else {
        const t = termOfV(r); const m = String(cells[creditCol]).match(/\d+(?:\.\d+)?/);
        if (t && m) { const x = conv(parseFloat(m[0])); if (x > 0) o[t] = x; }
      }
      return o;
    };

    // 창체
    const chaHere = !subj && (CHA_RE.test(rawName) || (zone === '창체') || leftTexts.some(x => CHA_RE.test(x)));
    if (chaHere || (inCha && !subj && CHA_SUB_RE.test(rawName))) {
      const vals = termVals(true);
      const isSub = CHA_SUB_RE.test(rawName) && !CHA_RE.test(rawName);
      if (isSub) { for (const t in vals) chaSub[t] = (chaSub[t] || 0) + vals[t]; }
      else if (!isTotalLabel(rawName)) { for (const t in vals) chaMain[t] = (chaMain[t] || 0) + vals[t]; }
      inCha = true; chaSeen = true; pendingMarker = null;
      continue;
    }
    // 합계 행
    const totalHere = !subj && (isTotalLabel(rawName) || leftTexts.some(isTotalLabel) || (!rawName && /(소\s*계|합\s*계|총\s*계)/.test(rowText) && !parsePick(rowText)));
    if (totalHere) {
      const vals = termVals();
      const lab = [rawName, ...leftTexts].join(' ');
      const bucket = chaSeen ? 'grand' : /지정/.test(lab) ? 'fixed' : /선택/.test(lab) ? 'elective' : 'sum';
      if (Object.keys(vals).length) totals[bucket] = vals;
      pendingMarker = null; inCha = false;
      continue;
    }
    inCha = false;
    const parts = subj ? null : splitSubjects(rawName);
    const nameOk = !!subj || !!parts || isSubjectLike(nameMarks.name);
    const selLabel = selCol >= 0 ? clean(cells[selCol]) : '';

    // 소인수·공동교육과정 등 편제 밖 과목
    if (offRow[r] || (mode === 'V' && zone === 'offer')) {
      if (nameOk) {
        const basev = baseCol >= 0 ? numIn(cells[baseCol]) : null;
        let firstVal = null;
        if (mode === 'H') for (const t in termCols) { const x = numIn(cells[termCols[t]]); if (x > 0 && x <= 12) { firstVal = x; break; } }
        else firstVal = numIn(cells[creditCol]);
        const list = parts || [{ name: subj ? subj.name : nameMarks.name, subj, tags: nameMarks.tags }];
        for (const pt of list) {
          if (offers.some(o => norm(o.name) === norm(pt.name))) continue;
          offers.push({
            name: pt.name, area: pt.subj ? pt.subj.area : rowAreaV, type: pt.subj ? pt.subj.type : rowTypeV,
            credits: opv > 0 ? opv : (basev > 0 ? basev : (firstVal > 0 && firstVal <= 5 ? firstVal : (pt.subj ? pt.subj.base : 2))),
            note: joinNote((pt.tags || []).join(' · '), rowNote), grading: rowGrading,
          });
        }
      }
      continue;
    }

    // 택N 표시 행(과목 없음)
    if (!nameOk) {
      const termPicks = {};
      if (mode === 'H') for (const t in termCols) { const p = parseTermCell(cells[termCols[t]]); if (p && p.pick) termPicks[t] = p.pick; }
      const lp = smallPickLeft(r);
      const pk = parsePick(rawName) || parsePick(selLabel) || (lp && lp.pick) || null;
      if (Object.keys(termPicks).length || pk) {
        pendingMarker = { id: 'mk' + r, label: clean(rawName || selLabel || (lp && lp.label) || ''), pick: pk, picks: termPicks };
      }
      continue;
    }

    // 학점
    const cr = {};

    case 'same': return `${J(q, '와/과')} ${J(c, '을/를')} 같은 학기에 듣게 되어 있습니다. ${J(q, '을/를')} 먼저 듣는 순서입니다.`;
    case 'later': return `${J(c, '이/가')} ${q}보다 앞 학기에 놓여 있습니다. ${J(q, '을/를')} 먼저 듣는 순서입니다.`;
    case 'missing': return p.level === 'strict' ? `${J(c, '을/를')} 들으려면 ${J(q, '을/를')} 먼저 이수해야 합니다.` : `${c} 전에 ${J(q, '을/를')} 들어 두면 수업을 따라가기 쉽습니다.`;
    case 'not-offered': return `${c}의 권장 선수과목 ${J(q, '은/는')} 우리 학교 편제표에 없습니다. 참고만 하세요.`;
    case 'common-fail': return `${J(c, '와/과')} 같은 교과의 공통과목(${q})이 미이수 상태입니다. 보충 이수를 먼저 챙기세요.`;

function areaCapacity(plan, area) {
  let cap = 0;
  const where = [];
  for (const s of plan.slots) {
    if (tIdx(s.term) < plan.nowIdx) continue;
    const opts = s.options.filter(r => areaOfRow(r) === area);
    if (!opts.length) continue;
    const n = s.remaining == null ? 1 : Math.min(s.remaining, opts.length);
    cap += opts.map(r => crOf(r, s.term)).sort((a, b) => b - a).slice(0, n).reduce((a, b) => a + b, 0);
    where.push({ slot: s, opts });
  }
  return { cap, where };
}

function alertsOf(plan, sum, cur, rules) {

    if (next.length) how += ` 이어서 듣는 ${next.slice(0, 3).join(', ')} 수업 전에 마치는 것이 좋습니다.`;

  }

    const where = `${termLabel(s.term)} ${shortLabel(s.label, s.term)}`;
    const need = s.kind === 'cross' ? `${where}: 이번 학기에 듣는 과목을 정해야 합니다`
      : (s.remaining == null ? `${where}: 과목을 골라야 합니다` : `${where}: ${s.remaining}과목을 더 골라야 합니다`);

    else if (i <= nowI + 1) out.push({ level: 'act', group: '선택 입력', title: need, detail: s.kind === 'cross' ? '반별로 학기를 바꿔 듣는 과목입니다. 우리 반 시간표를 보고 고르세요.' : `선택지 ${s.options.length}개 중에서 고릅니다. 과목별 참고 신호는 '다음 학기 안내'에 있습니다.`, term: s.term, go: s.term });
    else out.push({ level: 'info', group: '선택 입력', title: need, detail: '수강 신청 전까지 정하면 됩니다.', term: s.term, go: s.term });
  }
  for (const p of report) {

    const k = norm(it.name);
    if (seen[k] && seen[k].term !== it.term && !(it.row && seen[k].row === it.row)) out.push({ level: 'warn', group: '중복', title: `${J(it.name, '을/를')} 두 번 듣게 되어 있습니다`, detail: `${termLabel(seen[k].term)}와 ${termLabel(it.term)}에 같은 과목이 있습니다. 같은 과목은 한 번만 인정되니 다른 과목으로 바꾸세요.`, term: it.term, go: it.term });

}

  const fixedChecks = fixed.filter(i => i.area !== 'cha').map(i => {

    const n = norm(row.name);

    const area = areaOfRow(row);
    const cr = crOf(row, target);
    const tags = [];

    const dup = elsewhere(n, row);
    if (dup) { blocked = true; tags.push({ t: 'bad', m: `${termLabel(dup.term)}에 이미 들어 있음` }); }
    for (const p of idx.byCourse[n] || []) {
      if (before(norm(p.pre))) { score += 3; tags.push({ t: 'good', m: `${p.pre} 다음 단계` }); }
      else if (!hasName(cur, p.pre)) continue;
      else if (p.level === 'strict') { blocked = true; tags.push({ t: 'bad', m: `${J(p.pre, '을/를')} 먼저 들어야 함` }); }
      else { score -= 1; tags.push({ t: 'warn', m: `${p.pre} 먼저 들으면 좋음` }); }
    }

    if (a && a.lack > 0 && !chosen) { score += 4; tags.push({ t: 'good', m: `${a.label} 필수 ${a.lack}학점 부족분` }); }
    const unlocks = (idx.byPre[n] || []).map(p => p.course).filter(laterOffered);
    if (unlocks.length) { score += Math.min(2, unlocks.length); tags.push({ t: 'good', m: `이후 ${unlocks.slice(0, 2).join('·')}의 선수과목` }); }
    if (['kor', 'math', 'eng'].includes(area) && !chosen && sum.kme + cr > rules.kmeMax) { score -= 3; tags.push({ t: 'warn', m: `국·수·영 ${rules.kmeMax}학점 한도 넘음` }); }

    groups.push({ kind: 'block', label: b.label, pick, chosenCount: chosen.length, remaining: pick == null ? null : Math.max(0, pick - chosen.length), list });

  const ahead = sum.areas.filter(a => a.lack > 0).map(a => ({ area: a, cap: areaCapacity(plan, a.key) }));

  const rows = sum.areas.map(a => {
    const scale = Math.max(a.req, a.projected + a.forced, 1) * 1.1;
    const pct = v => (Math.max(0, v) / scale * 100).toFixed(2) + '%';
    const state = a.earned >= a.req ? '충족' : a.lack > 0 ? `${num(a.lack)}학점 모자람` : '입력대로면 충족';
    return `<div class="area-row a-${a.key}">
      <span class="area-name">${a.label}</span>
      <span class="bar" role="img" aria-label="${esc(a.label)}: 이수 ${num(a.earned)}, 수강 중 ${num(a.ongoing)}, 예정 ${num(a.planned)}, 필수 ${a.req}학점">
        <i class="b-earned" style="width:${pct(a.earned)}"></i><i class="b-ongoing" style="width:${pct(a.ongoing)}"></i><i class="b-planned" style="width:${pct(a.planned)}"></i><i class="b-forced" style="width:${pct(a.forced)}"></i>
        <b class="req" style="left:${pct(a.req)}"></b></span>
      <span class="area-num"><b>${num(a.earned)}</b> / ${a.req}<small class="${a.lack > 0 ? 'lack hl' : ''}">${state}</small></span>
    </div>`;
  }).join('');
  return `<div class="areas">${rows}</div>
    <p class="small" style="margin:10px 0 0">세로선이 필수 이수학점입니다. 진한 부분은 이수, 빗금은 수강 중, 옅은 부분은 예정, 점선은 앞으로 고를 묶음 중 이 교과만 있는 학점입니다. 숫자는 이수한 학점 / 필수 학점입니다.</p>`;
}
function commonHTML(sum) {
  return `<ul class="common">${sum.common.map(g => `<li><span class="cm-label">${g.label}</span>${g.parts.map(p =>
    `<span class="cm-part st-${p.status}"><span>${esc(p.name)}</span><small>${ST_LABEL[p.status] || ''}</small></span>`).join('')}</li>`).join('')}</ul>
    <p class="small" style="margin:10px 0 0">공통과목은 출석률 2/3 이상과 학업성취율 40% 이상을 모두 채워야 이수로 인정됩니다.</p>`;
}
function basisHTML(sum) {
  const subjEnd = sum.subj.earned + sum.subj.ongoing + sum.subj.planned + sum.pending;
  const chaEnd = sum.cha.earned + sum.cha.ongoing + sum.cha.planned;
  const totEnd = subjEnd + chaEnd;
  const row = (label, now, end, target, op) => {
    const ok = op === 'max' ? end <= target : end >= target;
    return `<tr><td>${label}</td><td>${num(now)}</td><td class="${ok ? 'flag-ok' : 'flag-bad'}">${num(end)}</td><td>${op === 'max' ? `${target} 이하` : `${target} 이상`}</td></tr>`;
  };
  return `<table class="plain"><thead><tr><th>항목</th><th>지금 이수</th><th>입력대로 졸업 때</th><th>기준</th></tr></thead><tbody>
    ${row('교과', sum.subj.earned, subjEnd, sum.subjTarget)}
    ${row('창의적 체험활동', sum.cha.earned, chaEnd, sum.chaTarget)}
    ${row('총 이수 학점', sum.total.earned, totEnd, sum.total.target)}
    ${row('국어·수학·영어 합계', sum.areaMap.kor.earned + sum.areaMap.math.earned + sum.areaMap.eng.earned, sum.kme, sum.kmeMax, 'max')}
    ${row('한국사', sum.koreanHistoryEarned, sum.koreanHistory, sum.koreanHistoryReq)}
  </tbody></table>
  <p class="small" style="margin:10px 0 0">'입력대로 졸업 때'에는 아직 고르지 않은 선택 과목 학점도 들어 있습니다. 미이수 학점은 빠져 있으니 보충 이수로 채워야 합니다.</p>`;
}
function prereqHTML(c) {
  const rep = C.prereqReport(c.plan, c.cur, S.rules);
  const seen = new Set();
  const bad = rep.filter(p => !['ok', 'not-offered'].includes(p.state)).filter(p => { const k = p.course.name + p.course.term + p.pre + p.state; if (seen.has(k)) return false; seen.add(k); return true; });
  const okN = new Set(rep.filter(p => p.state === 'ok').map(p => p.course.name + p.pre)).size;
  const items = bad.map(p => `<li><span class="lv${p.level === 'strict' ? ' strict' : ''}">${p.level === 'strict' ? '순서 필수' : '권장'}</span><b>${esc(p.pre)}</b>, <b>${esc(p.course.name)}</b> (${termLabel(p.course.term)})<div class="small">${esc(C.prereqMessage(p))}</div></li>`).join('');
  return `${items ? `<ul class="pre-list">${items}</ul>` : '<p class="ok">순서에 문제가 있는 과목이 없습니다.</p>'}
    <p class="small" style="margin:10px 0 0">선수과목을 먼저 듣는 순서가 맞는 과목 ${okN}개. 순서 규칙은 '기준 안내'에서 볼 수 있습니다.</p>`;
}
function viewStatus(c) {
  const { cur, plan, sum, alerts } = c;
  const t = sum.total;
  const parts = [`${t.target}학점 가운데 <b>${num(t.earned)}학점</b>을 이수했고`, `<b>${num(t.ongoing)}학점</b>을 듣는 중입니다.`];
  let tail = `앞으로 정해진 과목은 ${num(t.planned)}학점`;
  tail += sum.pending ? `, 아직 고르지 않은 과목은 ${num(sum.pending)}학점입니다.` : '입니다.';
  const failTxt = t.fail ? ` <span class="hl">미이수 ${num(t.fail)}학점은 보충 이수로 채워야 합니다.</span>` : '';
  const intro = !S.ui.introShown;
  return `
  <div class="page-head"><div><h2>이수 현황</h2><p class="lede">${esc(cur.title)}, ${termLabel(plan.now)} 기준</p></div>
    <div class="actions" style="margin-top:0"><button class="btn" data-act="print">보고서 인쇄</button></div></div>
  <section class="panel hero" aria-label="학점 요약">
    <p class="readout">${parts.join(' ')} ${tail}${failTxt}</p>
    ${ribbonHTML(plan, intro)}
    ${legendHTML()}
  </section>
  <div class="grid2">
    <section class="panel"><h3>확인할 일</h3>${alertsHTML(alerts)}</section>
    <section class="panel"><h3>교과(군)별 필수 이수학점</h3>${areasHTML(sum)}</section>
  </div>
  <div class="grid2">
    <section class="panel"><h3>공통과목 이수</h3>${commonHTML(sum)}</section>
    <section class="panel"><h3>졸업·편성 기준</h3>${basisHTML(sum)}</section>
  </div>
  <section class="panel"><h3>과목 순서 점검</h3>${prereqHTML(c)}</section>`;
}

/* ---------- 다음 학기 안내 ---------- */
function viewNext(c) {
  const { cur, plan, sum } = c;
  let target = S.ui.target;
  if (!TERMS.includes(target)) target = TERMS[Math.min(plan.nowIdx + 1, TERMS.length - 1)];
  const rec = C.recommend(plan, sum, cur, S.rules, target);
  const ti = C.tIdx(target);
  const w = whenOf(plan.nowIdx, target);
  const opts = TERMS.map(t => `<option value="${t}"${t === target ? ' selected' : ''}>${termLabel(t)}${t === plan.now ? ' (지금 학기)' : ''}</option>`).join('');
  const fixedList = rec.fixedChecks.map(({ item, probs }) => `<li>${cells(item.area, item.status, item.credits)}<span>${esc(item.name)} <span class="small">${num(item.credits)}학점</span>${probs.map(p => `<span class="warnline">${esc(J(p.pre, '을/를'))} ${p.level === 'strict' ? '먼저 이수해야 합니다' : '먼저 들으면 좋습니다'}</span>`).join('')}</span></li>`).join('');
  const groups = rec.groups.map(g => {
    const label = g.kind === 'cross' ? g.label : C.shortLabel(g.label, target);
    const status = g.remaining == null ? (g.chosenCount ? `${g.chosenCount}과목 고름` : '고르는 수 미정') : g.remaining ? `${g.remaining}과목 더 고르기` : '다 골랐음';
    const rows = g.list.map(o => {
      const act = g.kind === 'cross'
        ? `data-act="cross" data-key="${esc(plan.crosses.find(x => x.label === g.label).key)}" data-idx="${plan.crosses.find(x => x.label === g.label).terms.indexOf(target)}" data-name="${esc(o.name)}"`
        : `data-act="sel" data-term="${C.firstTerm(o.row)}" data-name="${esc(o.name)}" data-block="${esc(g.label)}"`;
      return `<li class="opt-row${o.blocked ? ' is-blocked' : ''}">
        <button class="tick" aria-pressed="${o.chosen}" ${act}${o.carried ? ' disabled' : ''} aria-label="${esc(o.name)} ${o.chosen ? '선택 해제' : '선택'}"></button>
        <div class="opt-main"><span class="nm">${esc(o.name)}</span><span class="meta">${metaSpans([areaLabel(o.area), o.type, `${num(o.credits)}학점`])}</span>
          ${o.tags.length ? `<div class="tags">${o.tags.map(tg => `<span class="tagx ${tg.t}">${esc(tg.m)}</span>`).join('')}</div>` : ''}
          <div class="fine">${metaSpans([o.note || '', o.grading ? `평가: ${o.grading}` : '', `이수 기준: ${o.pass}`])}</div></div></li>`;
    }).join('');
    return `<div class="pick-group"><div class="pick-head"><h4>${esc(label)}</h4><span class="small">${g.pick ? '택' + g.pick : ''}</span><span class="${g.remaining ? 'hl' : 'small'}">${status}</span></div><ol class="opt-list">${rows}</ol></div>`;
  }).join('');
  const aheadList = rec.ahead.map(a => {
    const where = a.cap.where.filter(x => C.tIdx(x.slot.term) >= ti).map(x => `${termLabel(x.slot.term)} ${C.shortLabel(x.slot.label, x.slot.term)}`);
    return `<li><b>${a.area.label}</b>: 필수 이수학점까지 ${num(a.area.lack)}학점이 모자랍니다. ${where.length ? `${where.slice(0, 4).join(', ')}에서 ${a.area.label} 과목을 고를 수 있습니다.` : '남은 선택에 이 교과가 없습니다. 담임 선생님과 공동교육과정·온라인학교 수강을 상의하세요.'}</li>`;
  }).join('');
  const laterByTerm = TERMS.filter(t => C.tIdx(t) > ti).map(t => {
    const ss = rec.later.filter(s => s.term === t);
    return ss.length ? `<li>${termLabel(t)}: ${ss.map(s => `${esc(s.kind === 'cross' ? s.label : C.shortLabel(s.label, t))}${s.remaining ? ` ${s.remaining}과목` : ''}`).join(', ')}</li>` : '';
  }).join('');
  const offers = cur.offers || [];
  const haveEx = new Set((c.st.extras || []).map(x => C.norm(x.name)));
  const offerList = offers.length ? `<section class="panel"><h3>소인수·공동교육과정 과목</h3>
    <p class="small" style="margin-top:0">학교 편제 학점과 따로 신청해서 듣는 과목입니다. 신청 시기와 방법은 담당 선생님께 확인하세요.</p>
    <ul class="fixed-list">${offers.map(o => `<li>${cells(o.area, 'planned', o.credits)}<span>${esc(o.name)} <span class="small">${num(o.credits)}학점${o.note ? ', ' + esc(o.note) : ''}</span></span>${haveEx.has(C.norm(o.name)) ? '<span class="small">추가함</span>' : `<button class="btn btn-small" data-act="offer-add" data-name="${esc(o.name)}" data-term="${target}" aria-label="${esc(o.name)}을 ${termLabel(target)}에 추가">추가</button>`}</li>`).join('')}</ul></section>` : '';
  return `
  <div class="guide-head"><h2>다음 학기 안내</h2><label class="sr" for="tsel">학기 고르기</label><select id="tsel" data-chg="target">${opts}</select></div>
  <p class="lede">${w.k === 'past' ? '끝난 학기입니다. 실제로 들은 과목과 맞는지 확인하세요.' : `${termLabel(target)}에 들을 과목을 정리했습니다. 선택 과목 옆의 표시는 편제표와 과목 순서, 필수 이수학점으로 계산한 참고 신호입니다. 무엇을 들을지는 진로와 흥미를 먼저 생각해서 정하세요.`}</p>
  ${careerCard('wide')}
  <div class="grid2">
    <section class="panel"><h3>골라야 할 과목</h3>${groups || '<p class="ok">이 학기에는 고를 과목이 없습니다.</p>'}</section>
    <div>
      <section class="panel"><h3>정해진 과목</h3>${fixedList ? `<ul class="fixed-list">${fixedList}</ul>` : '<p class="small">학교가 정한 과목이 없습니다.</p>'}
        <p class="small" style="margin:10px 0 0">창의적 체험활동 ${num(C.chaCreditOf(cur, target))}학점이 따로 있습니다.</p></section>
      <section class="panel"><h3>그다음을 위해</h3>
        ${aheadList ? `<ul class="ahead">${aheadList}</ul>` : '<p class="ok">지금 입력대로라면 교과(군)별 필수 이수학점을 모두 채웁니다.</p>'}
        ${laterByTerm ? `<h4 style="margin-top:14px">이후 학기에 고를 과목</h4><ul class="ahead small">${laterByTerm}</ul>` : ''}
      </section>
      ${offerList}
    </div>
  </div>`;
}

function routeGlyph() {
  const steps = [['kor', 2, 34], ['math', 13, 27], ['soc', 24, 20], ['sci', 35, 13]]
    .map(([a, x, y]) => `<rect class="a-${a}" x="${x}" y="${y}" width="9" height="9" rx="2" style="fill:var(--c)"/>`).join('');
  return `<svg class="cc-glyph" viewBox="0 0 72 46" aria-hidden="true" focusable="false">${steps}
    <rect x="46.75" y="6.75" width="7.5" height="7.5" rx="1.5" fill="none" stroke="#9AA6BD" stroke-width="1.5" stroke-dasharray="2 1.6"/>
    <path d="M62 3v22" stroke="#1E2B45" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M62.8 4h8.2l-2.6 3.4 2.6 3.4h-8.2z" fill="#FFE27A" stroke="#D9B63F" stroke-width="1"/></svg>`;
}
// 진로·학업 설계 지원 도구 연결 카드
function careerCard(variant) {
  const u = String(S.site.careerUrl || '').trim();
  if (!/^https?:\/\//i.test(u)) return '';
  const compact = variant === 'compact';
  const desc = compact
    ? '희망 계열·학과·대학에 맞는 과목과 이수 순서를 추천받을 수 있습니다.'
    : '희망 계열·학과·대학을 넣으면 필요한 과목과 학기별 이수 순서를 추천해 줍니다. 추천받은 과목은 여기 학기별 입력에서 고르면 학점 계산에 반영됩니다.';
  return `<a class="career-card${compact ? ' is-compact' : ''}" href="${esc(u)}" target="_blank" rel="noopener">
    ${routeGlyph()}
    <span class="cc-body"><span class="cc-title">진로·학업 설계 지원 도구</span><span class="cc-desc">${desc}</span></span>
    <span class="cc-go">새 창에서 열기</span></a>`;
}

/* ---------- 기준 안내 ---------- */
function viewRules() {
  const R = S.rules;
  const req = C.reqOf(R, S.site);
  const strict = R.prereq.filter(p => p.level === 'strict');
  const rec = R.prereq.filter(p => p.level !== 'strict');
  const reqRows = AREAS.map(a => `<tr><td>${esc(a.name)}</td><td class="num">${req[a.key]}학점</td><td>${a.key === 'soc' ? `한국사1·2(${R.koreanHistory}학점) 포함` : a.key === 'sci' ? '과학탐구실험1·2 포함' : ''}</td></tr>`).join('');
  return `<article class="panel rules-doc">
    <h2>기준 안내</h2>
    <p class="lede">2025학년도 이후 입학생에게 적용되는 2022 개정 교육과정 기준입니다. 학교 편제표나 학교 안내와 다를 때는 학교 안내를 따르세요.</p>
    <h3>졸업에 필요한 학점</h3>
    <p>3년 동안 <b>${R.totalCredits}학점</b>을 채웁니다. 교과 ${R.subjectCredits}학점과 창의적 체험활동 ${R.chaCredits}학점(288시간)입니다. 1학점은 50분 수업 16번에 해당합니다.</p>
    <h3>교과(군)별 필수 이수학점${S.site.schoolType === 'special' ? ' (특수목적고)' : ''}</h3>
    <table class="plain"><thead><tr><th>교과(군)</th><th class="num">최소 학점</th><th>비고</th></tr></thead><tbody>${reqRows}</tbody></table>
    <p class="small">국어·수학·영어 세 교과의 이수 학점 합은 ${R.kmeMax}학점을 넘을 수 없습니다.</p>
    <h3>과목을 이수했다고 인정받는 기준 (2026학년도부터)</h3>
    <ul>
      <li><b>공통과목</b>: 과목 출석률 2/3 이상, 학업성취율 40% 이상을 모두 채워야 합니다.</li>
      <li><b>선택과목</b>(일반·진로·융합): 과목 출석률 2/3 이상이면 이수로 인정됩니다. 2026학년도에는 1·2학년, 2027학년도부터 모든 학년에 적용됩니다.</li>
      <li><b>창의적 체험활동</b>: 학년 수업일수의 2/3 이상 출석하면 이수 학점을 채운 것으로 봅니다.</li>
      <li><b>미이수가 되었을 때</b>: 보충 지도(최소 성취수준 보장지도)나 온라인 보충 이수로 학점을 인정받을 수 있습니다. 온라인 이수는 학교·교육청에 신청하고, 콘텐츠의 2/3 이상에 출석하면 됩니다. 방법과 일정은 담당 선생님께 확인하세요.</li>
    </ul>
    <h3>성적표에 적히는 방식</h3>
    <table class="plain"><thead><tr><th>과목</th><th>평가</th></tr></thead><tbody>
      <tr><td>공통과목, 일반·진로·융합 선택과목</td><td>5등급과 성취도(A~E)</td></tr>
      <tr><td>사회·과학 교과의 융합 선택과목</td><td>성취도만 (등급 없음)</td></tr>
      <tr><td>체육·예술 교과</td><td>성취도 A·B·C</td></tr>
      <tr><td>교양 교과, 과학탐구실험1·2</td><td>이수 여부(P)</td></tr>
    </tbody></table>
    <h3>과목 순서</h3>
    <p>이름에 Ⅰ·Ⅱ나 1·2가 붙은 과목은 앞 번호를 먼저 듣습니다. 일반 선택과목과 이어지는 진로 선택과목은 일반 선택을 먼저 들으면 수업을 따라가기 쉽습니다.</p>
    <details class="howto"><summary>순서를 지켜야 하는 과목 ${strict.length}쌍</summary><ul class="small">${strict.map(p => `<li>${esc(p.pre)} 다음에 ${esc(p.course)}</li>`).join('')}</ul></details>
    <details class="howto"><summary>먼저 들으면 좋은 과목 ${rec.length}쌍</summary><ul class="small">${rec.map(p => `<li>${esc(p.pre)} 다음에 ${esc(p.course)}</li>`).join('')}</ul></details>
    <p class="src">근거: ${esc(R.basis)}. 학교마다 기준을 조정할 수 있으며, 이 화면의 숫자는 학교가 등록한 기준을 따릅니다. 공식 이수 여부는 학교생활기록부에 따릅니다.</p>
  </article>`;
}

/* ---------- 교사용 ---------- */

function issuesHTML(issues, notes) {
  const all = issues.map(i => ({ level: i.level, msg: i.msg })).concat((notes || []).map(m => ({ level: 'note', msg: m })));
  if (!all.length) return '<p class="ok small">확인할 문제가 없습니다.</p>';
  return `<ul class="issues">${all.map(i => `<li class="${i.level === 'bad' ? 'bad' : ''}">${esc(i.msg)}</li>`).join('')}</ul>`;
}
function parsedHTML() {
  if (!S.ui.parsed.length) return '';
  return S.ui.parsed.map((p, pi) => `
    <div class="parsed">
      <div class="found-head"><h4 style="margin:0">${esc(p.file)}</h4><button class="btn btn-small btn-quiet" data-act="parsed-close" data-pi="${pi}">목록에서 닫기</button></div>
      ${p.error ? `<p class="bad">${esc(p.error)}</p>` : ''}
      ${p.sheets && p.sheets.length ? `<table class="mini"><thead><tr><th>시트</th><th>결과</th></tr></thead><tbody>${p.sheets.map(s => `<tr><td>${esc(s.sheet)}</td><td>${s.ok ? (s.skipped ? '같은 입학년도에서 과목이 더 많은 시트를 썼습니다' : '읽었습니다') : esc(s.reason)}${s.diag && s.diag.subjCol != null && p.wb ? ` <button class="linklike" data-act="diag" data-pi="${pi}" data-sheet="${esc(s.sheet)}">진단 정보</button>` : ''}</td></tr>`).join('')}</tbody></table>` : ''}
      ${S.ui.diag && S.ui.diag.pi === pi ? diagHTML(p, S.ui.diag.sheet, pi) : ''}
      ${(p.curricula || []).map((cur, ci) => foundCard(p, cur, pi, ci)).join('')}
      ${S.ui.edit && S.ui.edit.parsed && S.ui.edit.pi === pi ? editorHTML() : ''}
    </div>`).join('');
}
function colName(i) { return i == null || i < 0 ? '없음' : String.fromCharCode(65 + (i % 26)) + (i >= 26 ? String(Math.floor(i / 26)) : ''); }
function diagHTML(p, sheet, pi) {
  const s = p.sheets.find(x => x.sheet === sheet);
  if (!s || !s.diag) return '';
  const d = s.diag;
  const terms = d.termCols ? Object.entries(d.termCols).map(([t, c]) => `${t}→${colName(c)}열`).join(', ') : '';
  return `<div class="found"><b>진단 정보: ${esc(sheet)}</b>
    <table class="mini"><tbody>
      <tr><th>과목명 열</th><td>${colName(d.subjCol)}열 (과목명 ${d.subjMatches || 0}개 일치)</td></tr>
      <tr><th>학기 열</th><td>${esc(terms || (d.mode === 'V' ? `학년 ${colName(d.gradeCol)}열, 학기 ${colName(d.semCol)}열, 학점 ${colName(d.creditCol)}열` : '찾지 못함'))}</td></tr>
      <tr><th>유형·교과·선택 열</th><td>유형 ${colName(d.typeCol)}열, 교과(군) ${colName(d.groupCol)}열, 선택그룹 ${colName(d.selCol)}열, 택 ${colName(d.pickCol)}열, 교차 ${colName(d.crossCol)}열</td></tr>
      ${d.blocks ? `<tr><th>선택 묶음</th><td>${esc(d.blocks.map(b => `${b.name}(택${Object.values(b.picks).filter(Boolean).join('/') || '?'}, ${b.n}과목)`).join(', ') || '없음')}</td></tr>` : ''}
    </tbody></table>
    <div class="actions wrap"><button class="btn btn-small" data-act="diag-dump" data-pi="${pi}" data-sheet="${esc(sheet)}">시트 내용 내려받기(CSV)</button><span class="small">잘 읽히지 않는 서식은 이 파일을 보내 주시면 규칙을 보강할 수 있습니다.</span></div></div>`;
}
function foundCard(p, cur, pi, ci) {
  const chk = C.checkCurriculum(cur, S.rules, S.site);
  const same = S.curricula.find(x => !x.sample && x.entryYear && x.entryYear === cur.entryYear);
  const sheet = (p.sheets || []).find(s => s.sheet === cur.sheet);
  const notes = sheet && sheet.diag ? sheet.diag.notes : [];
  const nSubj = cur.rows.filter(r => r.kind !== '창체').length;
  return `<div class="found">
    <div class="found-head"><label class="small">입학년도 <input type="number" min="2020" max="2045" value="${cur.entryYear || ''}" data-chg="found-year" data-pi="${pi}" data-pf="${ci}"></label><b>${esc(cur.title)}</b></div>

    ${issuesHTML(chk.issues, notes)}
    <div class="actions wrap">
      ${same ? `<button class="btn btn-primary" data-act="found-reg" data-pi="${pi}" data-pf="${ci}" data-replace="${esc(same.id)}">${same.entryYear}학년도 편제표를 이것으로 바꾸기</button><button class="btn" data-act="found-reg" data-pi="${pi}" data-pf="${ci}">따로 추가</button>`
             : `<button class="btn btn-primary" data-act="found-reg" data-pi="${pi}" data-pf="${ci}">등록</button>`}
      <button class="btn" data-act="found-edit" data-pi="${pi}" data-pf="${ci}">등록 전에 표로 확인·수정</button>
    </div></div>`;
}
function curCard(x) {

      <button class="btn" data-act="ed-cancel">닫기</button>
      <button class="btn btn-primary" data-act="ed-save">${e.parsed ? '이대로 등록' : '저장'}</button></div>
