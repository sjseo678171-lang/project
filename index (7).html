    <td><input data-pre="pre" data-pi="${i}" value="${esc(p.pre)}" list="dl-subj" aria-label="먼저 들을 과목"></td>
    <td><select data-pre="level" data-pi="${i}" aria-label="수준"><option value="strict"${p.level === 'strict' ? ' selected' : ''}>순서 필수</option><option value="rec"${p.level !== 'strict' ? ' selected' : ''}>권장</option></select></td>
    <td><button class="btn btn-small btn-quiet" data-act="pre-del" data-pi="${i}">삭제</button></td></tr>`).join('');
  return `<p class="small">2022 개정 교육과정 기본값이 들어 있습니다. 학교 기준이 다를 때만 고치세요.</p>
    <h4>교과(군)별 필수 이수학점 (일반고)</h4><div class="req-grid">${reqInputs}</div>
    <div class="req-grid" style="margin-top:10px">
      <label>특목고 예술<input type="number" min="0" max="60" data-rule="reqSpecial" data-k="art" value="${R.reqSpecial.art}"></label>
      <label>특목고 생활·교양<input type="number" min="0" max="60" data-rule="reqSpecial" data-k="life" value="${R.reqSpecial.life}"></label>
      <label>국·수·영 합계 한도<input type="number" min="0" max="174" data-rule="kmeMax" value="${R.kmeMax}"></label>
      <label>한국사 학점<input type="number" min="0" max="20" data-rule="koreanHistory" value="${R.koreanHistory}"></label>
    </div>
    <details class="howto"><summary>과목 순서 규칙 ${R.prereq.length}개</summary>
      <table class="mini pre-table"><thead><tr><th>과목</th><th>먼저 들을 과목</th><th>수준</th><th></th></tr></thead><tbody>${pre}</tbody></table>
      <div class="actions wrap"><button class="btn btn-small" data-act="pre-add">규칙 추가</button><button class="btn btn-small" data-act="rules-reset">기본값으로 되돌리기</button></div>
      ${subjDatalist()}
    </details>`;
}

/* ---------- 인쇄 보고서 ---------- */
function reportHTML(c) {
  const { cur, st, plan, sum, alerts } = c;
  const t = sum.total;
  const today = C.todayStr();
  const areaRows = sum.areas.map(a => `<tr><td>${a.label}</td><td>${a.req}</td><td>${num(a.earned)}</td><td>${num(a.ongoing)}</td><td>${num(a.planned)}</td><td class="${a.lack > 0 ? 'lackc' : ''}">${a.lack > 0 ? num(a.lack) + ' 모자람' : (a.earned >= a.req ? '충족' : '충족 예정')}</td></tr>`).join('');
  const subjEnd = sum.subj.earned + sum.subj.ongoing + sum.subj.planned + sum.pending;
  const chaEnd = sum.cha.earned + sum.cha.ongoing + sum.cha.planned;
  const commonRows = sum.common.map(g => `<tr><td>${g.label}</td>${g.parts.map(p => `<td class="${p.status === 'fail' ? 'failc' : ''}">${ST_LABEL[p.status] || ''}</td>`).join('')}</tr>`).join('');
  const al = alerts.filter(a => a.level !== 'info').slice(0, 10);
  const termBoxes = TERMS.map(tm => {
    const its = plan.items.filter(i => i.term === tm && i.area !== 'cha').sort((a, b) => areaIdx(a.area) - areaIdx(b.area));
    const sl = plan.slots.filter(s => s.term === tm);
    const total = its.reduce((s, i) => s + i.credits, 0);
    const pend = sl.reduce((s, x) => s + (x.remaining || 0) * x.credit, 0);
    return `<div class="rp-term"><h3><span>${termLabel(tm)}</span><span>${num(total + pend)}학점${pend ? ` (미정 ${num(pend)})` : ''}</span></h3><ul>
      ${its.map(i => `<li><span>${esc(i.name)}${i.src === '추가' ? ` (${esc(i.how || '추가')})` : ''}</span><span>${num(i.credits)}</span><span class="s-${i.status}">${ST_LABEL[i.status]}</span></li>`).join('')}
      ${sl.map(s => `<li class="pend"><span>${esc(s.kind === 'cross' ? s.label : C.shortLabel(s.label, tm))} ${s.remaining ? s.remaining + '과목' : ''}</span><span>${s.remaining ? num(s.remaining * s.credit) : ''}</span><span>미정</span></li>`).join('')}
    </ul></div>`;
  }).join('');
  const rep = C.prereqReport(plan, cur, S.rules).filter(p => !['ok', 'not-offered'].includes(p.state));
  const seen = new Set();
  const preLines = rep.filter(p => { const k = p.course.name + p.course.term + p.pre; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 8);
  return `<div class="rp">
    <div class="rp-head"><div><h1>과목 이수현황</h1><p>${esc(S.site.schoolName || '')}${S.site.schoolName && st.name ? ' ' : ''}${st.name ? esc(st.name) : ''}</p></div>
      <div class="rp-meta">${esc(cur.title)}<br>${termLabel(plan.now)} 기준, ${today} 출력</div></div>
    <p class="readout">${t.target}학점 가운데 <b>${num(t.earned)}학점</b> 이수, <b>${num(t.ongoing)}학점</b> 수강 중, 정해진 과목 ${num(t.planned)}학점${sum.pending ? `, 고르지 않은 과목 ${num(sum.pending)}학점` : ''}.${t.fail ? ` 미이수 ${num(t.fail)}학점은 보충 이수가 필요합니다.` : ''}</p>
    ${ribbonHTML(plan, false)}
    ${legendHTML()}
    <div class="rp-cols">
      <div><h2>교과(군)별 필수 이수학점</h2>
        <table><thead><tr><th>교과(군)</th><th>필수</th><th>이수</th><th>수강 중</th><th>예정</th><th>판단</th></tr></thead><tbody>${areaRows}</tbody></table></div>
      <div><h2>졸업·편성 기준</h2>
        <table><thead><tr><th>항목</th><th>지금 이수</th><th>졸업 때</th><th>기준</th></tr></thead><tbody>
          <tr><td>교과</td><td>${num(sum.subj.earned)}</td><td>${num(subjEnd)}</td><td>${sum.subjTarget} 이상</td></tr>
          <tr><td>창의적 체험활동</td><td>${num(sum.cha.earned)}</td><td>${num(chaEnd)}</td><td>${sum.chaTarget} 이상</td></tr>
          <tr><td>총 이수 학점</td><td>${num(t.earned)}</td><td>${num(subjEnd + chaEnd)}</td><td>${t.target} 이상</td></tr>
          <tr><td>국어·수학·영어 합계</td><td></td><td class="${sum.kme > sum.kmeMax ? 'failc' : ''}">${num(sum.kme)}</td><td>${sum.kmeMax} 이하</td></tr>
        </tbody></table>
        <h2>공통과목</h2><table><tbody>${commonRows}</tbody></table></div>
    </div>
    <h2>확인할 일</h2>
    ${al.length ? `<ul class="rp-alerts">${al.map(a => `<li class="${a.level}">${esc(a.title)}</li>`).join('')}</ul>` : '<p>지금 확인할 일이 없습니다.</p>'}
    <div class="rp-page2">
      <h2>학기별 과목</h2>
      <div class="rp-terms">${termBoxes}</div>
      <h2>과목 순서 점검</h2>
      ${preLines.length ? `<ul class="rp-alerts">${preLines.map(p => `<li>${esc(C.prereqMessage(p))}</li>`).join('')}</ul>` : '<p>순서에 문제가 있는 과목이 없습니다.</p>'}
      <p class="rp-foot">학생이 입력한 내용으로 계산한 참고 자료입니다. 공식 이수 여부는 학교생활기록부를 따릅니다. 기준: ${esc(S.rules.basis)}</p>
    </div>
  </div>`;
}

/* ---------- 동작 ---------- */
function goTab(tab, focusMain) {
  S.ui.tab = tab;
  try { history.replaceState(null, '', '#' + tab); } catch (e) { /* file:// 등 */ }
  render();
  window.scrollTo(0, 0);
  if (focusMain) $('#main').focus({ preventScroll: true });
}
function scrollToTerm(t) {
  const el = document.getElementById('term-' + t);
  if (el) el.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}
function blockByLabel(label) { return C.blocksOf(curNow()).find(b => b.label === label); }

const ACTS = {
  tab: el => goTab(el.dataset.tab, true),
  'banner-close': () => { S.banner = ''; render({ keepScroll: true }); },
  jump: el => scrollToTerm(el.dataset.term),
  goterm: el => { goTab('terms'); setTimeout(() => scrollToTerm(el.dataset.term), 30); },
  sel: el => {
    const st = S.student;
    const ft = el.dataset.term, name = el.dataset.name;
    const b = blockByLabel(el.dataset.block);
    if (!b) return;
    const row = b.rows.find(r => r.name === name && C.firstTerm(r) === ft);
    if (!row) return;
    const arr = st.sel[ft] = (st.sel[ft] || []).slice();
    const i = arr.indexOf(name);
    if (i >= 0) arr.splice(i, 1);
    else {
      for (const t of C.termsOf(row)) {
        const p = C.pickFor(b, t);
        if (p == null) continue;
        const chosen = b.rows.filter(r => C.crOf(r, t) && C.isSelected(st, r));
        if (chosen.length >= p) {
          if (p === 1 && chosen.length === 1) {
            const o = chosen[0];
            const oft = C.firstTerm(o);
            if (oft === ft) arr.splice(arr.indexOf(o.name), 1);
            else st.sel[oft] = (st.sel[oft] || []).filter(n => n !== o.name);
          } else {
            toast(`${J(C.shortLabel(b.label, t), '은/는')} ${p}과목까지 고릅니다. 다른 과목을 먼저 빼 주세요.`);
            return;
          }
        }
      }
      arr.push(name);
    }
    saveStudent();
    render({ keepScroll: true, keepFocus: true });
  },
  cross: el => {
    const st = S.student;
    const key = el.dataset.key, idx = +el.dataset.idx, name = el.dataset.name;
    const g = C.crossGroupsOf(curNow()).find(x => x.key === key);
    if (!g) return;
    const arr = (st.cross[key] || []).slice();
    const pair = g.rows.length === 2 && g.terms.length === 2;
    if (arr[idx] === name) {
      arr[idx] = null;
      if (pair) arr[1 - idx] = null;
    } else {
      arr[idx] = name;
      if (pair) arr[1 - idx] = g.rows.find(r => r.name !== name).name;
      else for (let j = 0; j < g.terms.length; j++) if (j !== idx && arr[j] === name) arr[j] = null;
    }
    st.cross[key] = arr.map(x => x || null);
    saveStudent();
    render({ keepScroll: true, keepFocus: true });
  },
  'offer-add': el => {
    const o = offerOf(el.dataset.name);
    if (!o) return;
    const t = el.dataset.term;
    const i = C.tIdx(t), nowI = C.tIdx(S.student.now);
    const status = i < nowI ? 'done' : i === nowI ? 'ongoing' : 'planned';
    S.student.extras.push({ id: C.uid('ex'), term: t, name: o.name, area: o.area === 'etc' ? 'life' : o.area, type: o.type, credits: o.credits, how: '소인수 과목', status, note: o.note });
    saveStudent();
    render({ keepScroll: true });
    toast(`${J(o.name, '을/를')} ${termLabel(t)} 추가 과목에 넣었습니다. 공동교육과정이면 '학기별 입력'에서 이수 방법을 바꿀 수 있습니다.`);
  },
  'ex-open': el => { S.ui.openEx = el.dataset.term; render({ keepScroll: true }); const f = $(`[data-form="extra"] input[name="name"]`); if (f) f.focus(); },
  'ex-close': () => { S.ui.openEx = null; render({ keepScroll: true }); },
  'ex-del': el => {
    const ex = S.student.extras.find(x => x.id === el.dataset.id);
    if (!ex || !confirm(`${J(ex.name, '을/를')} 목록에서 지울까요?`)) return;
    S.student.extras = S.student.extras.filter(x => x.id !== ex.id);
    saveStudent(); render({ keepScroll: true });
  },
  'stu-export': () => {
    const cur = curNow();
    const data = { app: 'isu-student', v: 1, savedAt: new Date().toISOString(), curriculum: { title: cur.title, entryYear: cur.entryYear }, student: S.student };
    download(`학점이수기록_${cur.entryYear || ''}_${safeName(S.student.name) || '학생'}_${C.todayStr()}.json`, JSON.stringify(data, null, 1), 'application/json');
    toast('기록 파일을 저장했습니다.');
  },
  'stu-reset': () => {
    if (!confirm('이 브라우저에 저장된 학생 입력(선택 과목, 이수 상태, 추가 과목, 이름)을 모두 지웁니다. 계속할까요?')) return;
    store.del(K_STU);
    S.student = null;
    fixStudent();
    render();
    toast('학생 기록을 지웠습니다.');
  },
  print: () => {
    const c = ctx();
    $('#print').innerHTML = reportHTML(c);
    setTimeout(() => window.print(), 60);
  },
  /* 교사용 */
  'tpl-download': async () => {
    try { await ensureXLSX(); } catch (err) { toast(err.message); return; }
    writeTemplate(null, `표준입력서식_편제표.xlsx`);
  },
  'cur-tpl': async el => {
    const cur = S.curricula.find(x => x.id === el.dataset.id);
    if (!cur) return;
    try { await ensureXLSX(); } catch (err) { toast(err.message); return; }
    writeTemplate(cur, `편제표_${cur.entryYear || ''}_표준서식_${C.todayStr()}.xlsx`);
  },
  'cur-edit': el => {
    const cur = S.curricula.find(x => x.id === el.dataset.id);
    if (!cur) return;
    if (S.ui.edit && S.ui.edit.id === cur.id) { S.ui.edit = null; render({ keepScroll: true }); return; }
    S.ui.edit = { id: cur.id, draft: JSON.parse(JSON.stringify(cur)), parsed: false };
    render({ keepScroll: true });
    const ed = $('#editor'); if (ed) ed.scrollIntoView({ block: 'start' });
  },
  'cur-new': () => {
    const y = new Date().getFullYear() + 1;
    S.ui.edit = { id: null, isNew: true, draft: C.normalizeCurriculum({ entryYear: y, title: `${y}학년도 입학생 교육과정 편제표`, rows: [{ kind: '지정', name: '', cr: {} }, { kind: '창체', name: '창의적 체험활동', cr: { '1-1': 3, '1-2': 3, '2-1': 3, '2-2': 3, '3-1': 3, '3-2': 3 } }] }), parsed: false };
    S.ui.edit.draft.rows.unshift({ kind: '지정', group: '', pick: '', area: 'kor', type: '공통', name: '공통국어1', cr: { '1-1': 4 }, cross: '', note: '' });
    render({ keepScroll: true });
    const ed = $('#editor'); if (ed) ed.scrollIntoView({ block: 'start' });
  },
  'cur-del': el => {
    const cur = S.curricula.find(x => x.id === el.dataset.id);
    if (!cur || !confirm(`${cur.entryYear || ''}학년도 편제표(${cur.title})를 지울까요? 배포 파일을 새로 만들기 전까지 학생 화면에는 영향이 없습니다.`)) return;
    S.curricula = S.curricula.filter(x => x.id !== cur.id);
    if (!S.curricula.length) S.curricula = [C.sampleCurriculum()];
    if (S.ui.edit && S.ui.edit.id === cur.id) S.ui.edit = null;
    saveWork(); render({ keepScroll: true }); toast('편제표를 지웠습니다.');
  },
  'found-reg': el => {
    const p = S.ui.parsed[+el.dataset.pi];
    const cur = p && p.curricula[+el.dataset.pf];
    if (!cur) return;
    if (!cur.entryYear) { toast('입학년도를 먼저 적어 주세요.'); return; }
    registerCurriculum(JSON.parse(JSON.stringify(cur)), el.dataset.replace || null);
    p.curricula.splice(+el.dataset.pf, 1);
    if (!p.curricula.length && !p.error) S.ui.parsed.splice(+el.dataset.pi, 1);
    render({ keepScroll: true });
  },
  'found-edit': el => {
    const pi = +el.dataset.pi, pf = +el.dataset.pf;
    const cur = S.ui.parsed[pi] && S.ui.parsed[pi].curricula[pf];
    if (!cur) return;
    const same = S.curricula.find(x => !x.sample && x.entryYear && x.entryYear === cur.entryYear);
    S.ui.edit = { id: null, draft: JSON.parse(JSON.stringify(cur)), parsed: true, pi, pf, replaceId: same ? same.id : null };
    render({ keepScroll: true });
    const ed = $('#editor'); if (ed) ed.scrollIntoView({ block: 'start' });
  },
  'parsed-close': el => { S.ui.parsed.splice(+el.dataset.pi, 1); S.ui.diag = null; if (S.ui.edit && S.ui.edit.parsed) S.ui.edit = null; render({ keepScroll: true }); },
  diag: el => {
    const pi = +el.dataset.pi;
    S.ui.diag = S.ui.diag && S.ui.diag.pi === pi && S.ui.diag.sheet === el.dataset.sheet ? null : { pi, sheet: el.dataset.sheet };
    render({ keepScroll: true });
  },
  'diag-dump': el => {
    const p = S.ui.parsed[+el.dataset.pi];
    if (!p || !p.wb || !window.XLSX) return;
    const csv = window.XLSX.utils.sheet_to_csv(p.wb.Sheets[el.dataset.sheet]);
    download(`시트내용_${safeName(p.file)}_${safeName(el.dataset.sheet)}.csv`, '\ufeff' + csv, 'text/csv');
  },
  'ed-add': () => {
    const d = S.ui.edit.draft;
    const last = d.rows.filter(r => r.kind !== '창체').slice(-1)[0];
    const row = { kind: last ? last.kind : '지정', group: last && last.kind === '선택' ? last.group : '', pick: last && last.kind === '선택' ? last.pick : '', area: last ? last.area : 'kor', type: last ? last.type : '일반', name: '', cr: {}, cross: '', note: '' };
    const chaIdx = d.rows.findIndex(r => r.kind === '창체');
    if (chaIdx >= 0) d.rows.splice(chaIdx, 0, row); else d.rows.push(row);
    rerenderEditor();
    const inputs = $$('#editor input[data-ed="name"]').filter(x => !x.value);
    if (inputs.length) inputs[inputs.length - 1].focus();
  },
  'ed-del': el => { S.ui.edit.draft.rows.splice(+el.dataset.i, 1); rerenderEditor(); },
  'of-add': () => { const d = S.ui.edit.draft; d.offers = d.offers || []; d.offers.push({ name: '', area: 'life', type: '진로', credits: 2, note: '', grading: '' }); rerenderEditor(); const x = $$('#editor input[data-of="name"]').pop(); if (x) x.focus(); },
  'of-del': el => { S.ui.edit.draft.offers.splice(+el.dataset.i, 1); rerenderEditor(); },
  'ed-cancel': () => { S.ui.edit = null; render({ keepScroll: true }); },
  'ed-save': () => {
    const e = S.ui.edit;
    const d = C.normalizeCurriculum(e.draft);
    if (!d.entryYear) { toast('입학년도를 적어 주세요.'); return; }
    if (!d.rows.some(r => r.kind !== '창체' && r.name)) { toast('과목이 한 줄도 없습니다.'); return; }
    d.updatedAt = C.todayStr();
    if (e.id) {
      d.id = e.id; d.sample = false;
      const i = S.curricula.findIndex(x => x.id === e.id);
      if (i >= 0) S.curricula[i] = d; else S.curricula.push(d);
      const hadSample = S.curricula.some(x => x.sample && x.id !== d.id);
      S.curricula = S.curricula.filter(x => !x.sample);
      saveWork();
      toast(hadSample ? '저장했습니다. 연습용 예시는 목록에서 뺐습니다.' : '저장했습니다.');
    } else {
      const same = S.curricula.find(x => !x.sample && x.entryYear && x.entryYear === d.entryYear);
      const replaceId = same ? (confirm(`${d.entryYear}학년도 편제표가 이미 있습니다.\n확인: 기존 편제표를 이것으로 바꿉니다.\n취소: 따로 추가합니다.`) ? same.id : null) : null;
      registerCurriculum(d, replaceId);
      if (e.parsed) {
        const p = S.ui.parsed[e.pi];
        if (p) { p.curricula.splice(e.pf, 1); if (!p.curricula.length && !p.error) S.ui.parsed.splice(e.pi, 1); }
      }
    }
    S.ui.edit = null;
    render({ keepScroll: true });
  },
  'pre-del': el => { S.rules.prereq.splice(+el.dataset.pi, 1); saveWork(); render({ keepScroll: true }); },
  'pre-add': () => { S.rules.prereq.push({ course: '', pre: '', level: 'rec' }); saveWork(); render({ keepScroll: true }); const x = $$('[data-pre="course"]').pop(); if (x) { x.closest('details').open = true; x.focus(); } },
  'rules-reset': () => {
    if (!confirm('필수 이수학점과 과목 순서 규칙을 2022 개정 교육과정 기본값으로 되돌릴까요?')) return;
    S.rules = C.rulesWithDefaults(null); saveWork(); render({ keepScroll: true }); toast('기본값으로 되돌렸습니다.');
  },
  deploy: () => {
    if (!realCurricula().length && !S.ui.depSample) { toast('등록된 편제표가 없습니다. 예시만 넣으려면 "연습용 예시 편제표도 넣기"를 켜세요.'); return; }
    if (S.ui.edit) { toast('편집 중인 표를 먼저 저장하거나 닫아 주세요.'); return; }
    download('index.html', buildDeployHTML(S.ui.depSample), 'text/html');
    toast('배포용 index.html을 내려받았습니다. 저장소에 올리면 학생 화면에 반영됩니다.');
  },
  'all-json': () => {
    const data = { app: 'isu-curricula', v: 1, savedAt: new Date().toISOString(), site: S.site, rules: S.rules, curricula: S.curricula.filter(c => !c.sample) };
    download(`편제표백업_${safeName(S.site.schoolName) || '학교'}_${C.todayStr()}.json`, JSON.stringify(data, null, 1), 'application/json');
  },
  'work-discard': () => {
    if (!confirm('이 브라우저의 교사용 작업본(등록·수정한 편제표와 기준)을 지우고 배포본으로 되돌릴까요?')) return;
    store.del(K_WORK);
    S.fromWork = false; S.workSavedAt = '';
    useEmbedded();
    if (!S.curricula.length) S.curricula = [C.sampleCurriculum()];
    S.ui.edit = null; S.ui.parsed = [];
    render(); toast('배포본으로 되돌렸습니다.');
  },
};
function registerCurriculum(cur, replaceId) {
  cur.sample = false;
  cur.updatedAt = cur.updatedAt || C.todayStr();
  const hadSample = S.curricula.some(x => x.sample);
  if (replaceId) {
    const i = S.curricula.findIndex(x => x.id === replaceId);
    cur.id = replaceId;
    if (i >= 0) S.curricula[i] = cur; else S.curricula.push(cur);
  } else {
    cur.id = C.uid('cur');
    S.curricula.push(cur);
  }
  S.curricula = S.curricula.filter(x => !x.sample).sort((a, b) => (b.entryYear || 0) - (a.entryYear || 0));
  saveWork();
  toast(`${cur.entryYear}학년도 편제표를 ${replaceId ? '바꿨습니다' : '등록했습니다'}.${hadSample ? ' 연습용 예시는 목록에서 뺐습니다.' : ''}`);
}
function writeTemplate(cur, name) {
  const X = window.XLSX;
  const ws = X.utils.aoa_to_sheet(C.templateAOA(cur, S.site.schoolName));
  ws['!cols'] = [6, 14, 5, 22, 9, 24, 6, 6, 6, 6, 6, 6, 12, 16].map(w => ({ wch: w }));
  ws['!merges'] = [{ s: { r: 1, c: 0 }, e: { r: 1, c: 13 } }];
  const wb = X.utils.book_new();
  X.utils.book_append_sheet(wb, ws, '편제표');
  const list = [['교과(군)', '교과', '과목 유형', '과목명', '기본 학점']].concat(C.SUBJECTS.map(s => [AREA[s.area].name, s.sub, s.type, s.name, s.base]));
  const ws2 = X.utils.aoa_to_sheet(list);
  ws2['!cols'] = [30, 10, 9, 24, 8].map(w => ({ wch: w }));
  X.utils.book_append_sheet(wb, ws2, '과목 목록');
  X.writeFile(wb, name);
}
function buildDeployHTML(withSample) {
  const data = {
    publishedAt: new Date().toISOString(),
    site: S.site,
    rules: S.rules,
    curricula: S.curricula.filter(c => withSample || !c.sample),
  };
  const json = JSON.stringify(data).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
  const i = PRISTINE.indexOf(DB_OPEN);
  const j = PRISTINE.indexOf(SCRIPT_CLOSE, i);
  if (i < 0 || j < 0) throw new Error('배포 파일을 만들 수 없습니다.');
  return PRISTINE.slice(0, i + DB_OPEN.length) + json + PRISTINE.slice(j);
}
let edBusy = false;
let edAgain = false;
function rerenderEditor() {
  if (edBusy) { edAgain = true; return; }
  const ed = $('#editor');
  if (!ed || !S.ui.edit) return;
  edBusy = true;
  try {
    const focus = focusKey(document.activeElement);
    const scroller = ed.querySelector('.scroll-x');
    const sx = scroller ? scroller.scrollLeft : 0, sy = scroller ? scroller.scrollTop : 0;
    const wrap = document.createElement('div');
    wrap.innerHTML = editorHTML();
    if (ed.isConnected) ed.replaceWith(wrap.firstElementChild);
    const ns = $('#editor .scroll-x');
    if (ns) { ns.scrollLeft = sx; ns.scrollTop = sy; }
    if (focus) restoreFocus(focus);
  } finally { edBusy = false; }
  if (edAgain) { edAgain = false; rerenderEditor(); }
}
async function readFiles(files) {
  if (!files.length) return;
  if (files.some(f => !/\.json$/i.test(f.name))) {
    try { await ensureXLSX(); } catch (err) { toast(err.message); return; }
  }
  for (const f of files) {
    const rec = { file: f.name, sheets: [], curricula: [] };
    try {
      if (/\.json$/i.test(f.name)) {
        const d = JSON.parse(await f.text());
        if (d.app === 'isu-student') throw new Error('학생 기록 파일입니다. 학생 화면 "내 정보"에서 불러오세요.');
        const arr = Array.isArray(d.curricula) ? d.curricula : (Array.isArray(d.rows) ? [d] : null);
        if (!arr) throw new Error('편제표 JSON 형식이 아닙니다.');
        rec.curricula = arr.map(x => { const cc = C.normalizeCurriculum(x); cc.sample = false; cc.source = cc.source || f.name; return cc; });
        rec.sheets = [{ sheet: 'JSON', ok: true }];
        if (d.rules && confirm('JSON에 이수 기준(필수 이수학점·과목 순서)도 들어 있습니다. 함께 불러올까요?')) { S.rules = C.rulesWithDefaults(d.rules); saveWork(); }
      } else {
        const buf = await f.arrayBuffer();
        let wb;
        if (/\.(csv|txt)$/i.test(f.name)) {
          let text;
          try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
          catch (e) { text = new TextDecoder('euc-kr').decode(buf); }
          wb = window.XLSX.read(text.replace(/^\ufeff/, ''), { type: 'string', raw: false });
          const nm = f.name.replace(/\.[^.]+$/, '');
          if (wb.SheetNames[0] !== nm) { wb.Sheets[nm] = wb.Sheets[wb.SheetNames[0]]; delete wb.Sheets[wb.SheetNames[0]]; wb.SheetNames[0] = nm; }
        } else {
          wb = window.XLSX.read(buf, { type: 'array' });
        }
        const res = C.scanWorkbook(wb, f.name);
        rec.sheets = res.sheets;
        rec.curricula = res.curricula;
        rec.wb = wb;
        if (!res.curricula.length) rec.error = '편제표를 찾지 못했습니다. 시트별 결과와 진단 정보를 확인하거나, 표준 입력서식에 옮겨 적어 올려 주세요.';
      }
    } catch (err) { rec.error = err.message || String(err); }
    S.ui.parsed.unshift(rec);
  }
  S.ui.diag = null;
  render({ keepScroll: true });
}

const CHGS = {
  cur: el => {
    const cur = S.curricula.find(x => x.id === el.value);
    if (!cur) return;
    S.student.curId = cur.id;
    S.student.entryYear = cur.entryYear;
    S.student.now = C.guessNowTerm(cur.entryYear);
    saveStudent(); render({ keepScroll: true });
  },
  now: el => { S.student.now = el.value; saveStudent(); render({ keepScroll: true }); toast(`${termLabel(el.value)} 기준으로 계산합니다.`); },
  name: el => { S.student.name = el.value.trim().slice(0, 20); saveStudent(); },
  status: el => {
    const key = el.dataset.key, v = el.value;
    if (key.indexOf('ex:') === 0) {
      const ex = S.student.extras.find(x => 'ex:' + x.id === key);
      if (ex) ex.status = v;
    } else {
      const term = key.split('@').pop();
      const def = C.statusDefault(C.tIdx(S.student.now), term);
      if (v === def) delete S.student.status[key]; else S.student.status[key] = v;
    }
    saveStudent(); render({ keepScroll: true, keepFocus: true });
  },
  cha: el => {
    const y = el.dataset.year;
    const ny = +S.student.now.charAt(0);
    const def = +y < ny ? 'done' : +y === ny ? 'ongoing' : 'planned';
    if (el.value === def) delete S.student.cha[y]; else S.student.cha[y] = el.value;
    saveStudent(); render({ keepScroll: true, keepFocus: true });
  },
  'stu-import': async el => {
    const f = el.files && el.files[0];
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.app !== 'isu-student' || !d.student || typeof d.student !== 'object') throw new Error('이 도구에서 저장한 기록 파일이 아닙니다.');
      const st = d.student;
      st.v = 1;
      S.student = st;
      fixStudent();
      saveStudent();
      render();
      toast('기록을 불러왔습니다.');
    } catch (err) { toast('불러오지 못했습니다. ' + err.message); }
    el.value = '';
  },
  target: el => { S.ui.target = el.value; render({ keepScroll: true }); },
  files: async el => { const fs = Array.from(el.files || []); el.value = ''; await readFiles(fs); },
  'found-year': el => {
    const p = S.ui.parsed[+el.dataset.pi];
    const cur = p && p.curricula[+el.dataset.pf];
    if (!cur) return;
    const y = parseInt(el.value, 10);
    cur.entryYear = y > 2000 ? y : null;
    render({ keepScroll: true });
  },
  'dep-sample': el => { S.ui.depSample = el.checked; },
};
function edChange(el) {
  const e = S.ui.edit;
  if (!e || edBusy || !el.closest('#editor')) return;
  if (el.dataset.edMeta) {
    const k = el.dataset.edMeta;
    e.draft[k] = k === 'entryYear' ? (parseInt(el.value, 10) || null) : el.value.trim();
    $('#ed-check').innerHTML = edCheckHTML(C.checkCurriculum(e.draft, S.rules, S.site));
    return;
  }
  const i = +el.dataset.i;
  const r = e.draft.rows[i];
  if (!r) return;
  const f = el.dataset.ed;
  let full = false;
  if (f === 'cr') {
    const v = parseFloat(String(el.value).replace(',', '.'));
    if (v > 0) r.cr[el.dataset.t] = v; else delete r.cr[el.dataset.t];
  } else if (f === 'kind') {
    r.kind = el.value;
    if (r.kind !== '선택') { r.group = ''; r.pick = ''; }
    if (r.kind === '창체') { r.area = 'cha'; r.type = '창체'; r.name = '창의적 체험활동'; }
    else if (r.area === 'cha') { r.area = 'etc'; r.type = '기타'; if (r.name === '창의적 체험활동') r.name = ''; }
    full = true;
  } else if (f === 'name') {
    r.name = el.value.trim();
    const ex = r.kind !== '창체' ? C.expandCommaRow(r) : null;
    if (ex && ex.rows.length > 1) {
      e.draft.rows.splice(i, 1, ...ex.rows);
      rerenderEditor();
      toast(ex.notes.join(' ') + ' 구분·학점을 확인하세요.');
      return;
    }
    const s = C.lookupSubject(r.name);
    if (s && r.kind !== '창체') { r.name = s.name; r.area = s.area; r.type = s.type; }
    full = true;
  } else if (f === 'pick') {
    r.pick = el.value.trim();
    for (const x of e.draft.rows) if (x.kind === '선택' && x.group === r.group) x.pick = r.pick;
    full = true;
  } else if (f === 'group') {
    r.group = el.value.trim();
    const mate = e.draft.rows.find(x => x !== r && x.kind === '선택' && x.group === r.group && x.pick !== '');
    if (mate) { r.pick = mate.pick; full = true; }
  } else if (f === 'area' || f === 'type' || f === 'cross' || f === 'note') {
    r[f] = el.value.trim();
  }
  if (full) rerenderEditor();
  else $('#ed-check').innerHTML = edCheckHTML(C.checkCurriculum(e.draft, S.rules, S.site));
}
function offerChange(el) {
  const e = S.ui.edit;
  if (!e || edBusy || !el.closest('#editor')) return;
  const o = (e.draft.offers || [])[+el.dataset.i];
  if (!o) return;
  const f = el.dataset.of;
  if (f === 'credits') o.credits = parseFloat(String(el.value).replace(',', '.')) || 0;
  else if (f === 'name') {
    o.name = el.value.trim();
    const list = C.splitSubjects(o.name);
    if (list) {
      const extra = list.map(p => ({ name: p.name, area: p.subj ? p.subj.area : o.area, type: p.subj ? p.subj.type : o.type, credits: o.credits, note: C.stripMarks(o.name).tags.join(' · ') || o.note, grading: o.grading }));
      e.draft.offers.splice(+el.dataset.i, 1, ...extra);
      toast(`${list.length}과목으로 나눴습니다.`);
    } else {
      const s = C.lookupSubject(o.name);
      if (s) { o.name = s.name; o.area = s.area; o.type = s.type; }
    }
    rerenderEditor();
  } else o[f] = el.value.trim();
}
function ruleChange(el) {
  const k = el.dataset.rule;
  const v = Math.max(0, parseFloat(el.value) || 0);
  if (k === 'req' || k === 'reqSpecial') S.rules[k][el.dataset.k] = v;
  else S.rules[k] = v;
  saveWork();
  toast('기준을 바꿨습니다.');
}
function preChange(el) {
  const p = S.rules.prereq[+el.dataset.pi];
  if (!p) return;
  const f = el.dataset.pre;
  if (f === 'level') p.level = el.value === 'strict' ? 'strict' : 'rec';
  else { const s = C.lookupSubject(el.value); p[f] = s ? s.name : el.value.trim(); if (s) el.value = s.name; }
  saveWork();
}
function siteChange(el) {
  const k = el.dataset.site;
  S.site[k] = el.type === 'radio' ? el.value : el.value.trim();
  saveWork();
  renderChrome(ctx());
}

/* ---------- 연결 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el, e)).catch(err => toast('처리하지 못했습니다. ' + (err && err.message ? err.message : '')));
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('label.btn[tabindex]')) {
    e.preventDefault();
    const inp = e.target.querySelector('input[type=file]');
    if (inp) inp.click();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (!el || !el.dataset) return;
  if (el.dataset.chg && CHGS[el.dataset.chg]) CHGS[el.dataset.chg](el, e);
  else if (el.dataset.ed || el.dataset.edMeta) edChange(el);
  else if (el.dataset.of) offerChange(el);
  else if (el.dataset.rule) ruleChange(el);
  else if (el.dataset.pre) preChange(el);
  else if (el.dataset.site) siteChange(el);
  else if (el.name === 'name' && el.closest('[data-form="extra"]')) {
    const f = el.closest('form');
    const o = offerOf(el.value);
    const s = C.lookupSubject(el.value);
    if (o) {
      el.value = o.name;
      if (AREA[o.area] && o.area !== 'etc') f.area.value = o.area;
      if (TYPES.includes(o.type)) f.type.value = o.type;
      f.credits.value = o.credits;
      f.how.value = '소인수 과목';
    } else if (s) { el.value = s.name; f.area.value = s.area; f.type.value = s.type; f.credits.value = s.base; }
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset.form !== 'extra') return;
  e.preventDefault();
  const fd = new FormData(f);
  const name = String(fd.get('name') || '').trim();
  if (!name) { toast('과목명을 적어 주세요.'); return; }
  const credits = parseFloat(fd.get('credits'));
  if (!(credits > 0)) { toast('학점을 적어 주세요.'); return; }
  const list = C.splitSubjects(name) || [{ name, subj: C.lookupSubject(name) }];
  const added = list.map(p => {
    const s = p.subj;
    const o = offerOf(p.name);
    const multi = list.length > 1;
    return {
      id: C.uid('ex'), term: f.dataset.term, name: o ? o.name : (s ? s.name : p.name),
      area: o && o.area !== 'etc' ? o.area : (s ? s.area : fd.get('area')), type: o ? o.type : (s ? s.type : fd.get('type')),
      credits: multi ? (o ? o.credits : (s ? s.base : credits)) : credits, how: fd.get('how'), status: fd.get('status'), note: o ? o.note : '',
    };
  });
  S.student.extras.push(...added);
  S.ui.openEx = null;
  saveStudent();
  render({ keepScroll: true });
  toast(added.length > 1 ? `${added.map(x => x.name).join(', ')} ${added.length}과목을 추가했습니다. 학점이 다르면 지우고 다시 추가하세요.` : `${J(added[0].name, '을/를')} 추가했습니다.`);
});
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (!z) return;
  e.preventDefault();
  z.classList.remove('over');
  readFiles(Array.from(e.dataTransfer.files || []));
});
window.addEventListener('afterprint', () => { $('#print').innerHTML = ''; });
window.addEventListener('storage', e => { if (e.key === K_STU) { const st = store.get(K_STU); if (st) { S.student = st; render({ keepScroll: true }); } } });

load();
render();
window.__isu = { S, ctx, buildDeployHTML };
})();

</script></body></html>
